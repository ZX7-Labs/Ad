name: "Voice Lab — Original British Assistant vs Cinematic"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch and Apache-2.0 Qwen voice designer
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "qwen-tts==0.1.1" "numpy>=1.26,<3" "soundfile>=0.12,<1" "accelerate==1.12.0" "transformers==4.57.3"
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Check Python source
        run: python -m py_compile voice_lab/design_british_assistant.py
      - name: Cache original open-weight model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-voicedesign17b-2026-10
      - name: Render two original voice profiles
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: |
          free -h
          python -u voice_lab/design_british_assistant.py
      - name: Verify finished audio
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          for name in ("british-assistant","cinematic-baritone"):
              path=Path("voice_lab/voice_design")/(name+".wav")
              x=sf.info(str(path))
              assert x.channels==1 and x.duration>3 and x.duration<40,(name,x)
              assert (path.with_suffix(".mp3")).stat().st_size>10000
              print("PASS",name,round(x.duration,2))
          PY
      - name: Upload direct audio auditions
        uses: actions/upload-artifact@v4
        with:
          name: voice-original-british-cinematic
          path: voice_lab/voice_design/
          retention-days: 7
