name: "ZX7 BODY — Real Mobile Browser Acceptance"
on:
  workflow_dispatch:
  push:
    branches: [zx7-body/mobile-operator-20261021]
    paths:
      - ".github/workflows/studio-body-browser-acceptance.yml"
      - "studio_next/test_body_browser.py"
      - "studio_next/test_body_revision_impact.py"
      - "studio_next/body_mobile.py"
      - "studio_next/test_body_revision_http.py"
      - "studio_next/body_revision_impact.py"
      - "studio_next/body_service.py"
      - "studio_next/body_verified_delivery.py"
      - "studio_next/body_host_resources.py"
      - "studio_next/test_body_host_resources.py"
      - "studio_next/body_download_tickets.py"
      - "studio_next/media_vault.py"
      - "studio_next/body_integration.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-mobile-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install real browser and real media source decoders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --no-cache-dir "playwright>=1.55,<2" "Pillow>=10,<13"
          python -m playwright install --with-deps chromium
      - name: Prove mobile owner UI with running Chromium and actual HTTP media rights
        env:
          ZX7_BROWSER_QA_PNG: ${{ github.workspace }}/output/real-browser/mobile-operator.png
        run: |
          mkdir -p output/real-browser
          python -m unittest studio_next.test_body_browser -v 2>&1 | tee output/real-browser/browser-run.txt
          test -s output/real-browser/mobile-operator.png
      - name: Keep real browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-real-browser-production-console-evidence
          path: output/real-browser/
          if-no-files-found: warn
          retention-days: 7
