name: "ZX7 Creative Logic — Free CPU Contract Tests"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-creative-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate authentic scene grammar without paid inference
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
