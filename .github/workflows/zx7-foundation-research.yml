name: ZX7 Reproducible Foundation Research
on:
  push:
    branches: [main]
    paths:
      - "scripts/research_audio_clock.py"
      - "scripts/research_native_editor.py"
      - "research/browser-engine/**"
      - ".github/workflows/zx7-foundation-research.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/research_audio_clock.py"
      - "scripts/research_native_editor.py"
      - "research/browser-engine/**"
      - ".github/workflows/zx7-foundation-research.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-foundation-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physical-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      LC_ALL: C
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual open native engines and editorial exchange library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg melt frei0r-plugins
          python -m pip install 'opentimelineio==0.18.1'
      - name: Record unchanged adapter audio timing, including mismatches
        run: |
          python scripts/research_audio_clock.py --out output/foundation/audio-clock.json --summary-out output/foundation/audio-clock-summary.json
      - name: Compare native MLT and FFmpeg source frames before and after revision
        run: |
          python scripts/research_native_editor.py --probe-activation --out output/foundation/native-editor.json
      - name: Verify existing strict native OTIO behavior with actual library
        run: |
          python -m unittest studio_next.test_body_sequence_otio -v
      - name: Preserve diagnostic measurements even if a later experiment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-foundation-differential
          path: output/foundation/
          retention-days: 14
          if-no-files-found: warn
  browser-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install actual vector reference renderer and decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg inkscape
      - name: Install locked research-only browser engine without package install scripts
        working-directory: research/browser-engine
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test research receipt gates before native rendering
        working-directory: research/browser-engine
        run: node --test evaluate.test.mjs
      - name: Install browser pinned by the installed Puppeteer version
        working-directory: research/browser-engine
        run: ./node_modules/.bin/puppeteer browsers install chrome-headless-shell
      - name: Measure actual seeking at integer and NTSC rates against native SVG reference
        working-directory: research/browser-engine
        run: node probe.mjs --out ../../output/foundation/browser-motion.json
      - name: Preserve browser measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-browser-foundation-differential
          path: output/foundation/browser-motion.json
          retention-days: 14
          if-no-files-found: warn
