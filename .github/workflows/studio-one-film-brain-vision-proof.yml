name: "ZX7 One Film Brain — Real Footage Vision Review"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    paths: [".github/workflows/studio-one-film-brain-vision-proof.yml"]
permissions:
  contents: read
  actions: read
jobs:
  inspect-actual-encoded-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODEL_REPO: DavidAU/Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF
      MODEL_REVISION: d5f3139249b7ee2535c20ab81125c9a6ab0c4915
      MODEL_FILE: Qwen3.5-9B-The-Defiant-Fable-Uncnr-Heretic-NEO-MAX-Q4_K_M.gguf
      MODEL_ALIAS: zx7-visual-director-one-brain
      OUTPUT: output/same-film-brain-actual-vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify local evidence-only vision adapter
        run: |
          python -m unittest discover -s studio_next -p 'test_*.py' -v
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Obtain independently proven real audiovisual 2D+3D film
        uses: actions/download-artifact@v4
        with:
          name: ZX7-real-multi-engine-2D-3D-film-and-scenes
          run-id: 39513980044
          github-token: ${{ github.token }}
          path: actual-evidence
      - name: Verify actual decoded video bytes, not hallucinated footage
        run: |
          mkdir -p "$OUTPUT"
          find actual-evidence -type f -name '*.mp4' -print
          VIDEO="$(find actual-evidence -type f -name 'zx7-real-mixed-film.mp4' -print -quit)"
          test -f "$VIDEO"
          echo "ACTUAL_VIDEO=$VIDEO" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries format=duration:stream=codec_type \
            -of json "$VIDEO" > "$OUTPUT/observed-ffprobe.json"
      - name: Load one and the same licensed film-creative model with its visual projector
        run: |
          mkdir -p models/film-eye /tmp/zx7-llama
          curl -fL --retry 3 -sS \
            "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
            -o "models/film-eye/$MODEL_FILE"
          curl -fL --retry 3 -sS \
            "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/mmproj-F16.gguf" \
            -o models/film-eye/mmproj-F16.gguf
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=[]
          for p in (Path("models/film-eye")/os.environ["MODEL_FILE"],
                    Path("models/film-eye/mmproj-F16.gguf")):
              assert p.stat().st_size>100000, "Incomplete model/projector"
              out.append({"name":p.name,"bytes":p.stat().st_size,
                "sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          Path(os.environ["OUTPUT"],"model-vision-weights.json").write_text(
              json.dumps({"pinned_revision":os.environ["MODEL_REVISION"],
              "files":out,"licenses_as_declared_by_hub":"Apache-2.0"},indent=2))
          PY
          curl -fL --retry 3 -sS \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/zx7-llama/package.tar.gz
          tar -xzf /tmp/zx7-llama/package.tar.gz -C /tmp/zx7-llama
          SERVER="$(find /tmp/zx7-llama -type f -name llama-server | head -n 1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Film model independently critiques real decoded preview frames
        run: |
          "$LLAMA_SERVER" --model "models/film-eye/$MODEL_FILE" \
            --mmproj models/film-eye/mmproj-F16.gguf \
            --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8085 \
            --ctx-size 8192 --threads 4 --parallel 1 \
            --reasoning-budget 0 --no-webui \
            > "$OUTPUT/film-brain.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for i in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=2) as resp:
                      if resp.status==200:break
              except OSError:time.sleep(2)
          else:raise SystemExit("Actual single VLM did not load; no artificial critique")
          print("SAME FILM DIRECTOR VISION READY",flush=True)
          PY
          python -u -m studio_next.film_eye \
            --video "$ACTUAL_VIDEO" \
            --goal "This genuine archival ZX7 technical clip joins an original vector-motion shot to an actually Blender-rendered, sculpted metal ring with directed light and moving 3D camera. Assess what is really visible: causal composition, material readability and whether the cut would move an audience. This was NOT previously accepted as professional cinema." \
            --time 0.7 --time 3.5 --model "$MODEL_ALIAS" \
            --api http://127.0.0.1:8085 --out "$OUTPUT"
      - name: Archive actual visual evidence and unaudited single-brain critique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-same-film-brain-actual-decoded-image-review
          path: output/same-film-brain-actual-vision/
          if-no-files-found: warn
          retention-days: 7
