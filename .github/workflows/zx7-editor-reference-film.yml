name: ZX7 Original Faceless Editing Film — ChatGPT Brain to Existing BODY
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zx7-editor-reference-film.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-chatgpt-directed-native-body-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing BODY native runtimes and original narrator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg melt frei0r-plugins fonts-dejavu-core fonts-noto-core libsndfile1 libgomp1
          python -m pip install --no-cache-dir "numpy>=1.26,<3" "Pillow>=10,<13" "fonttools>=4,<5" "soundfile>=0.12,<1" "onnxruntime>=1.19,<2" "huggingface_hub>=0.25,<2"
          python -m pip install --no-cache-dir "git+https://github.com/supertone-oss-archive/supertonic-py.git@df0f9686dac7fbbde391b759e2ee5286a3737622"
          ffmpeg -version | head -1
          melt -query version
      - name: Inspect original authored film contract and native editing ABI
        run: |
          python -m compileall -q studio_next motion_studio
          python -m unittest studio_next.test_body_mlt_editor studio_next.test_body_mlt_roundtrip studio_next.test_body_mlt_grade studio_next.test_body_tool_contracts -v 2>&1 | tee /tmp/zx7-film-preflight.log
          python - <<'PY'
          import json
          from pathlib import Path
          from studio_next.body_integration import body_catalog
          p=json.loads(Path("examples/creative-evidence/enter-click-20261029.json").read_text())
          assert len(p["scenes"])==15 and len(p["assets"])>=50
          assert 90<sum(s["min_seconds"] for s in p["scenes"])<115
          tools={x["id"]:x for x in body_catalog(Path("output/editor")).discover()}
          for name in ("body.mlt_owned_export","body.mlt_owned_render"):
              assert name in tools and tools[name]["status"]=="installed",(name,tools.get(name))
          print("BODY ORIGINAL DIRECTOR INPUT AND ACTUAL MLT EDIT TOOLS VERIFIED",flush=True)
          PY
      - name: Cache checked license-specific original voice model weights
        uses: actions/cache@v4
        with:
          path: supertonic_assets
          key: supertonic3-aafc6e32416a594460b32413efc49d7fe4ce6d46
      - name: Obtain pinned real narrator model
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          print(snapshot_download("supertone-oss-archive/supertonic-3",
            revision="aafc6e32416a594460b32413efc49d7fe4ce6d46",
            local_dir="supertonic_assets",max_workers=4))
          PY
      - name: Existing ZX7 BODY generates measured voice and original motion project
        run: |
          mkdir -p output/motion output/editor
          python -u -m motion_studio.voice --project examples/creative-evidence/enter-click-20261029.json --model-dir supertonic_assets --out output/motion
          python -u -m motion_studio.render --project examples/creative-evidence/enter-click-20261029.json --out output/motion --width 720 --fps 24
      - name: Existing ZX7 BODY creates a source-attested, real editable MLT picture and sound edit
        run: |
          python - <<'PY'
          import json,subprocess,shutil,hashlib
          from pathlib import Path
          from studio_next.body_integration import body_catalog
          from studio_next.media_vault import MediaVault
          from studio_next.body_mlt_roundtrip import recover_original_mlt_plan
          root=Path("output/editor").resolve()
          root.mkdir(parents=True,exist_ok=True)
          src=Path("output/motion/picture.mp4").resolve()
          video=root/"source-bt709.mp4"
          subprocess.run(["ffmpeg","-nostdin","-hide_banner","-loglevel","error","-y",
            "-i",str(src),"-map","0:v:0","-an","-c:v","libx264","-preset","fast","-crf","17",
            "-pix_fmt","yuv420p","-color_primaries","bt709","-color_trc","bt709","-colorspace","bt709",
            "-r","24","-movflags","+faststart",str(video)],check=True)
          sound=root/"source-mix.wav"
          shutil.copyfile("output/motion/mix.wav",sound)
          vault=MediaVault(root/"vault")
          def generated(file,mime):
              return vault.ingest(file,mime=mime,rights="generated_original",
               source_type="trusted_renderer",
               source_id="zx7-body-motion-studio-20261029-"+file.name,
               evidence="Original authored BODY project; media decoded and hashed on GitHub runner",
               owner_or_generator="ZX7 BODY with ChatGPT director")
          visual=generated(video,"video/mp4")
          audio=generated(sound,"audio/wav")
          manifest=json.loads(Path("output/motion/render-manifest.json").read_text())
          total=0;cuts=[]
          for scene in manifest["scenes"]:
              length=round(scene["seconds"]*24)
              cuts.append({"source":"zx7:sha256:"+visual["asset_id"],
                 "asset_id":visual["asset_id"],"attestation_id":visual["attestation_id"],
                 "position_frame":total,"first_frame":total,"end_frame":total+length,
                 "audio":"intentional_silence"})
              total+=length
          def probe(filename):
              return json.loads(subprocess.check_output(["ffprobe","-v","error",
                "-count_frames","-select_streams","v:0","-show_entries",
                "stream=nb_read_frames,r_frame_rate,color_space,color_primaries,color_transfer",
                "-of","json",str(filename)]))["streams"][0]
          recorded=probe(video)
          assert int(recorded["nb_read_frames"])==total,(recorded,total)
          assert recorded["r_frame_rate"]=="24/1"
          assert recorded["color_space"]=="bt709" and recorded["color_primaries"]=="bt709"
          sclip={"source":"zx7:sha256:"+audio["asset_id"],
            "asset_id":audio["asset_id"],"attestation_id":audio["attestation_id"],
            "position_frame":0,"first_frame":0,"end_frame":total}
          plan={"frame_rate":{"numerator":24,"denominator":1},
            "frame_size":{"width":720,"height":1280},
            "tracks":[{"clips":cuts}],
            "audio_tracks":[{"clips":[sclip],"gain_db":0}]}
          (root/"native-cut-plan.json").write_text(json.dumps(plan,indent=2)+"\n")
          body=body_catalog(root)
          export=body.invoke("body.mlt_owned_export",{"plan":"native-cut-plan.json","out":"actual-edit.mlt"},allowed_access={"write"})
          print("NATIVE PROJECT",json.dumps(export,default=str),flush=True)
          recovered=recover_original_mlt_plan(root/"actual-edit.mlt",root,root/"vault")
          assert recovered==plan, "Original per-scene edit and sound did not roundtrip"
          rendered=body.invoke("body.mlt_owned_render",{"edit":"actual-edit.mlt","out":"final-film.mp4"},allowed_access={"write"})
          print("NATIVE RENDER",json.dumps(rendered,default=str),flush=True)
          final=root/"final-film.mp4"
          data=json.loads(subprocess.check_output(["ffprobe","-v","error","-count_frames",
            "-show_streams","-show_format","-of","json",str(final)]))
          vid=[s for s in data["streams"] if s["codec_type"]=="video"]
          aud=[s for s in data["streams"] if s["codec_type"]=="audio"]
          assert len(vid)==1 and len(aud)==1
          assert (vid[0]["width"],vid[0]["height"])==(720,1280)
          assert int(vid[0]["nb_read_frames"])==total,(vid[0],total)
          duration=float(data["format"]["duration"])
          assert 90<=duration<=120,(duration,total)
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(final),
            "-map","0:v:0","-map","0:a:0","-f","null","-"],check=True,timeout=600)
          report={"film":"THE INVISIBLE JOURNEY OF A CLICK","renderer":"existing ZX7 BODY motion_studio + existing native MLT BODY tools",
            "source_engine_modified":False,"reference_videos_reused":False,"scene_count":len(cuts),
            "editable_native_project":"actual-edit.mlt","original_audio_source":"source-mix.wav",
            "format_seconds":duration,"frames":total,"fps":24,"width":720,"height":1280,
            "audio_channels":aud[0].get("channels"),"video_sha256":hashlib.sha256(final.read_bytes()).hexdigest(),
            "technical_av_decode_verified":True,"autonomous_local_model_inference_claimed":False,
            "premium_creative_quality_certified":False}
          (root/"verified-film-report.json").write_text(json.dumps(report,indent=2)+"\n")
          print("COMPLETE VERIFIED BODY FILM",json.dumps(report),flush=True)
          PY
      - name: Retain playable video and editable proof outside public source repo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZX7-ChatGPT-Brain-BODY-Design-Led-108s-Film
          if-no-files-found: warn
          retention-days: 7
          path: |
            output/editor/final-film.mp4
            output/editor/actual-edit.mlt
            output/editor/native-cut-plan.json
            output/editor/verified-film-report.json
            output/motion/sample.mp4
            output/motion/render-manifest.json
            output/motion/voice-timing.json
            output/motion/frames/*.jpg
