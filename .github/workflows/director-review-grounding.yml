name: Director review — evidence-linked motion-design recheck
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODEL_REPO: unsloth/Qwen3.5-9B-GGUF
      MODEL_REVISION: 3885219b6810b007914f3a7950a8d1b469d598a5
      MODEL_FILE: Qwen3.5-9B-Q4_K_M.gguf
      MODEL_BYTES: 5680522464
      MODEL_SHA256: 03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
      MODEL_DIR: models/qwen35-9b
      MODEL_ALIAS: qwen35-9b-3885219b6810b007914f3a7950a8d1b469d598a5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and test contracts
        run: |
          python -m pip install -r director_research/requirements.txt
          python -m unittest discover -s director_research -p 'test_*.py' -v
      - name: Get pinned CPU runtime
        run: |
          mkdir -p /tmp/grounded-runtime
          curl --fail --location --silent --show-error --retry 2 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/grounded-runtime/runtime.tar.gz
          tar --no-same-owner -xzf /tmp/grounded-runtime/runtime.tar.gz -C /tmp/grounded-runtime
          echo "LLAMA_RUNTIME=/tmp/grounded-runtime/llama-b11750" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: model_cache
        with:
          path: ${{ env.MODEL_DIR }}
          key: grounded-qwen35-9b-3885219b6810b007914f3a7950a8d1b469d598a5
      - name: Download and verify pinned Apache-2.0 weights
        run: |
          mkdir -p "$MODEL_DIR" output/grounded
          if [ ! -f "$MODEL_DIR/$MODEL_FILE" ]; then
            curl --fail --location --silent --show-error --retry 2 \
              "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
              -o "$MODEL_DIR/download.gguf"
            mv "$MODEL_DIR/download.gguf" "$MODEL_DIR/$MODEL_FILE"
          fi
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['MODEL_DIR'])/os.environ['MODEL_FILE']
          assert p.stat().st_size==int(os.environ['MODEL_BYTES'])
          with p.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          assert digest==os.environ['MODEL_SHA256'],'Model checksum mismatch'
          Path('output/grounded/model-provenance.json').write_text(json.dumps({
              'repository':os.environ['MODEL_REPO'],'revision':os.environ['MODEL_REVISION'],
              'filename':p.name,'bytes':p.stat().st_size,'sha256':digest},indent=2))
          print('Verified model:',p,digest)
          PY
      - uses: actions/cache/save@v4
        if: steps.model_cache.outputs.cache-hit != 'true'
        with:
          path: ${{ env.MODEL_DIR }}
          key: ${{ steps.model_cache.outputs.cache-primary-key }}
      - name: Review the unchanged saved proposal
        run: |
          mkdir -p output/grounded
          export LD_LIBRARY_PATH="$LLAMA_RUNTIME"
          "$LLAMA_RUNTIME/llama-server" \
            --model "$MODEL_DIR/$MODEL_FILE" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8085 --ctx-size 16384 \
            --threads 4 --parallel 1 --reasoning-budget 0 --no-webui \
            > output/grounded/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(60):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8085/health', timeout=2) as response:
                      if response.status == 200:
                          break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Model server did not become healthy')
          PY
          python -u -m director_research.grounded \
            --brief examples/physical-product-brief.json \
            --proposal director_research/evaluations/2026-10-20-model-comparison/qwen35-9b-physical/result.json \
            --out output/grounded/review-v2 --repairs 0
      - name: Save full plans, rejected drafts, model responses and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-v2-qwen35-9b-physical
          path: output/grounded/
          if-no-files-found: error
          retention-days: 7
