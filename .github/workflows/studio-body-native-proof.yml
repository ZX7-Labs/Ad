name: "ZX7 BODY — Native 2D and Blender 3D From Actual Independent Tool DAG"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    paths: [".github/workflows/studio-body-native-proof.yml"]
permissions:
  contents: read
jobs:
  render-genuine-multi-engine-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify runtime contracts and safe original media recovery
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Install actual trusted original artist tools (not images or APIs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core fonts-urw-base35 libsndfile1
          python -m pip install --no-cache-dir "numpy>=1.26,<3" "Pillow>=10,<13" "opentimelineio>=0.17,<1"
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Independent body engine creates original 3D and 2D frames, sound, editable cut and real MP4
        run: |
          python -u -m studio_next.body_native_proof --out output/body-real-native-film
      - name: Independently inspect real production bytes after crash-safe DAG second pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          out=Path("output/body-real-native-film")
          proof=json.loads((out/"verified-native-body-result.json").read_text())
          assert all(proof[x] for x in ("real_3d_rendered","real_2d_rendered",
            "editable_otio_produced","real_audio_and_video_verified",
            "exact_all_nodes_resumed"))
          assert proof["human_premium_art_quality_proven"] is False
          for name in ("actual-full-mixed-film.mp4","actual-full-mixed-film.otio",
               "zx7-real-3d/scene-3d.mp4","zx7-2d/sample.mp4","actual-director-frame.png"):
              p=out/name
              assert p.is_file() and p.stat().st_size>1000,(p,"missing")
              print("ACTUAL FOSS BODY ARTIFACT",name,
                    p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())
          streams=json.loads(subprocess.check_output(["ffprobe","-v","error",
            "-show_format","-show_streams","-of","json",
            str(out/"actual-full-mixed-film.mp4")]))
          assert sum(s.get("codec_type")=="video" for s in streams["streams"])==1
          assert sum(s.get("codec_type")=="audio" for s in streams["streams"])==1
          print("BODY MULTIENGINE TECHNICAL RENDER AND RESUME: REAL, NOT AI FILM QUALITY")
          PY
      - name: Retain actual newly rendered body proof clips and independently editable source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-genuine-body-3d-motion-audio-otio-mp4-resumable
          path: |
            output/body-real-native-film/actual-full-mixed-film.mp4
            output/body-real-native-film/actual-full-mixed-film.otio
            output/body-real-native-film/zx7-real-3d/scene-3d.mp4
            output/body-real-native-film/zx7-2d/sample.mp4
            output/body-real-native-film/actual-director-frame.png
            output/body-real-native-film/verified-native-body-result.json
            output/body-real-native-film/measured/
          if-no-files-found: warn
          retention-days: 7
