name: "ZX7 Genuine 3D Scene — Blender CPU Render Proof"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-genuine-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify all Studio engine tests on free CPU
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Install Blender and FFmpeg from Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg fonts-urw-base35
          python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13"
          blender --version | head -n 2
      - name: Render animated scene with actual 3D geometry, lighting, perspective and directed camera
        run: |
          mkdir -p output/zx7-real-3d/frames
          blender --background --factory-startup --python-exit-code 1 \
            --python studio_next/blender_scene.py -- \
            --scene studio_next/fixtures/three_dimensional_shot.json \
            --out output/zx7-real-3d/frames
      - name: Encode frames into genuine video
        run: |
          ffmpeg -hide_banner -loglevel error -y -framerate 12 -start_number 1 \
            -i output/zx7-real-3d/frames/frame_%04d.png \
            -c:v libx264 -pix_fmt yuv420p -crf 20 -movflags +faststart \
            output/zx7-real-3d/scene-3d.mp4
      - name: Independently verify 3D footage was rendered
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          out=Path("output/zx7-real-3d")
          frames=sorted((out/"frames").glob("frame_*.png"))
          assert len(frames)==24, len(frames)
          vid=out/"scene-3d.mp4"
          media=json.loads(subprocess.check_output(["ffprobe","-v","error",
              "-count_frames","-show_entries",
              "stream=codec_type,codec_name,width,height,nb_read_frames",
              "-show_entries","format=duration",
              "-of","json",str(vid)]))
          video=[s for s in media["streams"] if s["codec_type"]=="video"]
          assert len(video)==1 and video[0]["codec_name"]=="h264"
          assert (video[0]["width"],video[0]["height"])==(256,256)
          assert int(video[0]["nb_read_frames"])==24
          assert vid.stat().st_size>7000
          print("VERIFIED genuine 3D animated MP4",len(frames),"frames",
                round(float(media["format"]["duration"]),2),"seconds")
          PY
      - name: Independently compile and render previous 2D Film IR inside same production
        run: |
          python -m studio_next.motion_bridge \
            --ir studio_next/fixtures/vector_two_scene_film_ir.json \
            --out output/zx7-2d/project.json
          python -m studio_next.silent_audio \
            --project output/zx7-2d/project.json --out output/zx7-2d
          python -m motion_studio.render \
            --project output/zx7-2d/project.json --out output/zx7-2d \
            --width 320 --fps 12
      - name: Assemble real 2D and 3D shots with intentional sound policies
        run: |
          python -m studio_next.edit_timeline \
            --edit studio_next/fixtures/mixed_engine_timeline.json \
            --root output --out output/zx7-real-mixed-film.mp4
      - name: Inspect combined final MP4, exact audio/video streams and run duration
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path("output/zx7-real-mixed-film.mp4")
          info=json.loads(subprocess.check_output(["ffprobe","-v","error",
               "-show_format","-show_streams","-of","json",str(p)]))
          vs=[x for x in info["streams"] if x.get("codec_type")=="video"]
          au=[x for x in info["streams"] if x.get("codec_type")=="audio"]
          assert len(vs)==1 and len(au)==1
          assert (vs[0]["width"],vs[0]["height"])==(320,480)
          assert 4.5<float(info["format"]["duration"])<5.5
          assert p.stat().st_size>10000
          manifest=json.loads(Path("output/edit-manifest.json").read_text())
          assert manifest["source_engines"]==["vector-opening","true-three-dimensional-scene"]
          print("VERIFIED TRUE MIXED 2D/3D film",round(float(info["format"]["duration"]),2),"seconds")
          PY
      - name: Preserve rendered video and independent frame evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZX7-real-multi-engine-2D-3D-film-and-scenes
          path: |
            output/zx7-real-mixed-film.mp4
            output/edit-manifest.json
            output/zx7-2d/sample.mp4
            output/zx7-2d/project.json
            output/zx7-real-3d/scene-3d.mp4
            output/zx7-real-3d/frames/frame_0001.png
            output/zx7-real-3d/frames/frame_0012.png
            output/zx7-real-3d/frames/frame_0024.png
          if-no-files-found: warn
          retention-days: 7
