name: "Research — Qwen3.5 Cinema Director Benchmark"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/director-qwen35-research.yml"
permissions:
  contents: read
jobs:
  creative-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify research code and independent safety gates
        run: |
          python -m py_compile director_research/benchmark.py director_research/test_benchmark.py
          python -m unittest discover -s director_research -p "test_*.py" -v
      - name: Install lightweight downloader and HTTP tools
        run: |
          python -m pip install "huggingface_hub>=0.25,<2"
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates
      - name: Get recent CPU runtime supporting Qwen3.5 hybrid layers
        run: |
          mkdir -p /tmp/qwen-llama
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz" \
            -o /tmp/llama-runtime.tar.gz
          tar -xzf /tmp/llama-runtime.tar.gz -C /tmp/qwen-llama
          SERVER="$(find /tmp/qwen-llama -type f -name llama-server | head -n1)"
          test -n "$SERVER"
          chmod +x "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Cache Qwen3.5-4B Q4_K_M open weights
        uses: actions/cache@v4
        with:
          path: models/director35
          key: qwen35-4b-soai-q4km-0c82e2
      - name: Retrieve verified public Apache-2.0 4B GGUF
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import os
          p=hf_hub_download(repo_id="SoAIHQ/Qwen3.5-4B-GGUF",
              filename="Qwen3.5-4B-Q4_K_M.gguf",
              revision="0c82e2f4c9582ecd5f49c0f02a21b4d60c4ad603",
              local_dir="models/director35")
          print("Model ready:",p,os.path.getsize(p),flush=True)
          assert os.path.getsize(p)>2_000_000_000
          PY
      - name: Start local model server (CPU, no external API)
        run: |
          mkdir -p output/qwen35-director
          nohup "$LLAMA_SERVER" \
            --model models/director35/Qwen3.5-4B-Q4_K_M.gguf \
            --host 127.0.0.1 --port 8085 --ctx-size 8192 \
            --threads 4 --parallel 1 --reasoning-budget 0 --no-webui \
            > output/qwen35-director/server.log 2>&1 < /dev/null &
          echo "Server PID: $!"
          for n in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8085/health >/dev/null 2>&1; then
              echo "Server is healthy";exit 0
            fi
            sleep 2
          done
          echo "Local server failed to become healthy"
          tail -80 output/qwen35-director/server.log
          exit 1
      - name: Actual 24-second film direction challenge
        run: |
          python -u director_research/benchmark.py \
            --brief examples/sample-brief.json \
            --api http://127.0.0.1:8085 \
            --out output/qwen35-director
      - name: Upload inspected plan, critic and performance traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen35-director-filmplan-research
          path: |
            output/qwen35-director/film_plan.json
            output/qwen35-director/film_plan_draft.json
            output/qwen35-director/storyboard.md
            output/qwen35-director/failure.json
            output/qwen35-director/server.log
          if-no-files-found: warn
          retention-days: 7
