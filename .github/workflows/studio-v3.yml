name: "AD Studio V3 — Open-source Video Director"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    if: github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[VIDEO]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout open-source engine
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-lato fonts-noto-core libsndfile1
      - name: Install open-source Python packages
        run: python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "soundfile>=0.12,<1" "kokoro-onnx>=0.5,<1"
      - name: Compile and validate scripts
        run: python -m py_compile src/film_v3.py src/issue_to_brief.py
      - name: Cache open-weight male narrator
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-fp32-v1.0-model-files-v1.1
      - name: Download the full precision Apache 2.0 voice model
        shell: bash
        run: |
          mkdir -p models
          if [ ! -s models/kokoro-v1.0.onnx ]; then
            curl -fSL --retry 3 --retry-delay 3 --connect-timeout 30 \
              "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx" \
              -o models/kokoro-v1.0.onnx
          fi
          if [ ! -s models/voices-v1.0.bin ]; then
            curl -fSL --retry 3 --retry-delay 3 --connect-timeout 30 \
              "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin" \
              -o models/voices-v1.0.bin
          fi
          test "$(stat -c%s models/kokoro-v1.0.onnx)" -gt 300000000
          test "$(stat -c%s models/voices-v1.0.bin)" -gt 20000000
      - name: Parse creative briefing answers
        if: github.event_name == 'issues'
        run: python src/issue_to_brief.py "$GITHUB_EVENT_PATH"
      - name: Prepare original sample brief
        if: github.event_name != 'issues'
        run: |
          mkdir -p output
          cp examples/sample-brief.json output/input_brief.json
      - name: Render the short with original sound design
        run: python src/film_v3.py --brief output/input_brief.json --voice am_michael
      - name: Verify voice, dimensions and video duration
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess
          p=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_format','-show_streams','-of','json','output/short.mp4']))
          vs=[s for s in p['streams'] if s['codec_type']=='video']
          au=[s for s in p['streams'] if s['codec_type']=='audio']
          assert vs and vs[0]['width']==1080 and vs[0]['height']==1920, vs
          assert au, 'Narrator audio stream missing'
          assert float(p['format']['duration'])>7,'Video too short'
          print('PASS: 1080x1920, duration',p['format']['duration'],'audio present')
          PY
      - name: Upload finished video MP4
        uses: actions/upload-artifact@v4
        with:
          name: AD-original-motion-film
          path: |
            output/short.mp4
            output/creative_brief.json
            output/input_brief.json
          retention-days: 7
      - name: Tell the owner where to download their film
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '🎬 Your original faceless video is ready. Open the [completed video render](%s), then find **Artifacts → AD-original-motion-film**, unzip and play **short.mp4**.\n' "$RUN_URL" > result.txt
          gh issue comment "$NUMBER" --body-file result.txt
