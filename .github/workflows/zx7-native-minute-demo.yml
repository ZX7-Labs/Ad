name: "ZX7 BODY — 60s Source-Owned Native Editable Video Acceptance"
on:
  pull_request:
    branches: [main]
    paths:
      - "engines/velorn/minute-demo.py"
      - "engines/velorn/mcp-e2e.py"
      - "studio_next/body_editor_*.py"
      - ".github/workflows/zx7-native-minute-demo.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-minute-edit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-full-native-editor-standard-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact source and pinned native editor
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install local native GUI, decoding and exact protocol dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Verify genuine clean pinned third-party source before install
        run: |
          actual="$(git -C third_party/velorn rev-parse HEAD)"
          test "$actual" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          node --version
          python -c 'import mcp; import jsonschema; print("Actual MCP SDK and schema validation imported")'
      - name: Build the complete source editor, not a mocked UI
        working-directory: third_party/velorn
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
      - name: Enable Chromium's intended SUID sandbox rather than disabling it
        working-directory: third_party/velorn
        run: |
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
          echo "ELECTRON SANDBOX: ROOT-OWNED 4755 HELPER VERIFIED (no --no-sandbox)"
      - name: Produce 60-second real source-owned original and native editor timeline
        run: |
          python -u engines/velorn/minute-demo.py \
            --source "$GITHUB_WORKSPACE/third_party/velorn" \
            --artifacts "$GITHUB_WORKSPACE/output/zx7-native-minute" \
            --xvfb-binary /usr/bin/Xvfb \
            --display 127.0.0.1:95
      - name: Verify the saved one-minute demo is real, editable, source-owned and not a quality claim
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("output/zx7-native-minute")
          data=json.loads((root/"evidence.json").read_text())
          assert data["success"] and data["technicalDemoOnly"]
          assert data["sourceOwnedGeneratedShots"]==5
          assert data["editableClips"]==11 and data["editableTracks"]==7
          assert data["frames"]==1440 and data["fullDecodePassed"]
          assert not data["professionalCreativeCapabilityComplete"]
          assert not data["autonomousArtisticQualityProven"]
          movie=root/"zx7-body-one-minute-native-demo.mp4"
          assert movie.is_file() and movie.stat().st_size>100000
          assert hashlib.sha256(movie.read_bytes()).hexdigest()==data["sha256"]
          native=root/"native-editable-project"/"project.comfystudio"
          doc=json.loads(native.read_text())
          assert len(doc["timelines"][0]["clips"])==11
          assert len(doc["assets"])==6
          assert all(not Path(asset["path"]).is_absolute() for asset in doc["assets"])
          assert all((native.parent / asset["path"]).exists() for asset in doc["assets"])
          assert len(data["distinctVideoFrames"])==5
          assert len({r["sha256"] for r in data["distinctVideoFrames"]})==5
          print("ZX7 ONE-MINUTE REAL EDITOR OUTPUT + COMPLETE EDITABLE SOURCE VERIFIED")
          PY
      - name: Preserve real one-minute movie and its complete editable source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-native-60s-real-movie-and-editable-project
          path: output/zx7-native-minute/
          if-no-files-found: error
          retention-days: 14
      - name: Diagnose isolated native editor startup without hiding failures
        if: failure()
        run: |
          for log in /tmp/zx7-editor-mcp-*/state/session-*/launcher.log; do
            if test -f "$log"; then
              echo "NATIVE EDITOR DIAGNOSTICS: $log"
              tail -n 120 "$log"
            fi
          done
      - name: Recheck pinned native source remains unchanged
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
