name: "Voice Lab — Qwen3 male A/B"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voice-lab.yml"
permissions:
  contents: read
jobs:
  test-voices:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: voice_lab/requirements.txt
      - name: Install voice dependencies on CPU only
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r voice_lab/requirements.txt
      - name: Cache open weight speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-0.6b-custom-voice-v1
      - name: Synthesize identical script in two voices
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: python -u voice_lab/audition_qwen.py
      - name: Confirm the voices are valid audio
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          for name in ('ryan-sample.wav','aiden-sample.wav'):
              path=Path('voice_lab/output')/name
              info=sf.info(str(path))
              assert info.duration>=3 and info.channels==1, (path,info)
              print('PASS',name,round(info.duration,2),'s',info.samplerate,'Hz')
          PY
      - name: Upload actual audition samples
        uses: actions/upload-artifact@v4
        with:
          name: "voice-lab-ryan-vs-aiden"
          path: voice_lab/output/
          retention-days: 7
