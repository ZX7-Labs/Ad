name: "Research — Original Creative Story Competition"
on:
  workflow_dispatch:
  push:
    branches: [studio-vnext-independent-proof]
    paths:
      - "studio_next/creative_challenge.py"
      - "studio_next/test_creative_challenge.py"
      - "studio_next/experiments/**"
      - ".github/workflows/studio-story-competition.yml"
permissions:
  contents: read
jobs:
  compare-creative-stories:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - genre: product
            brief: studio_next/experiments/product.json
          - genre: knowledge
            brief: studio_next/experiments/knowledge.json
    env:
      MODEL_REPO: SoAIHQ/Qwen3.5-4B-GGUF
      MODEL_REVISION: 0c82e2f4c9582ecd5f49c0f02a21b4d60c4ad603
      MODEL_FILE: Qwen3.5-4B-Q4_K_M.gguf
      MODEL_BYTES: 2783447136
      MODEL_SHA256: 2ebe6eb67cb92adeffc7073c48dd4e3baf79465ac650793dc751cad2b29cf219
      MODEL_DIR: models/qwen35-4b
      MODEL_ALIAS: qwen35-4b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python safety contracts and independent story validation
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Fetch verified llama.cpp CPU engine
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y curl ca-certificates libgomp1
          mkdir -p /tmp/film-runtime
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/film-runtime/runtime.tar.gz
          tar --no-same-owner -xzf /tmp/film-runtime/runtime.tar.gz -C /tmp/film-runtime
          SERVER="$(find /tmp/film-runtime -type f -name llama-server | head -n1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Reuse local Qwen3.5-4B checkpoint if available
        uses: actions/cache/restore@v4
        with:
          path: models/qwen35-4b
          key: grounded-qwen35-4b-0c82e2f4c9582ecd5f49c0f02a21b4d60c4ad603
      - name: Download and verify actual open weights before inference
        run: |
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/$MODEL_FILE" ]; then
            curl --fail --location --silent --show-error --retry 3 \
              "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
              -o "$MODEL_DIR/$MODEL_FILE"
          fi
          python - <<'PY'
          import os,hashlib
          from pathlib import Path
          p=Path(os.environ["MODEL_DIR"])/os.environ["MODEL_FILE"]
          assert p.stat().st_size==int(os.environ["MODEL_BYTES"]),"Wrong checkpoint size"
          with p.open("rb") as f:
            digest=hashlib.file_digest(f,"sha256").hexdigest()
          assert digest==os.environ["MODEL_SHA256"],"Wrong model checksum"
          print("VERIFIED CHECKPOINT",p,digest,flush=True)
          PY
      - name: Generate contrasting ideas, selected screenplay and skeptical review
        env:
          BRIEF: ${{ matrix.brief }}
          GENRE: ${{ matrix.genre }}
        run: |
          mkdir -p "output/creative/$GENRE"
          "$LLAMA_SERVER" --model "$MODEL_DIR/$MODEL_FILE" \
            --alias "$MODEL_ALIAS" \
            --host 127.0.0.1 --port 8085 --ctx-size 12288 \
            --threads 4 --parallel 1 --reasoning-budget 0 --no-webui \
            > "output/creative/$GENRE/model.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for x in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=2) as r:
                      if r.status==200:
                          print("LOCAL FILM BRAIN READY",flush=True)
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit("Film brain did not start")
          PY
          python -u -m studio_next.creative_challenge \
            --brief "$BRIEF" \
            --api http://127.0.0.1:8085 \
            --model "$MODEL_ALIAS" \
            --out "output/creative/$GENRE"
      - name: Preserve drafts, failures, model timings and final creative treatment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-comp-${{ matrix.genre }}
          path: output/creative/${{ matrix.genre }}/
          if-no-files-found: warn
          retention-days: 7
