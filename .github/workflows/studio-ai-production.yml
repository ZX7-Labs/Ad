name: "ZX7 AI Director — Original Film Production Attempt"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    # Heavy free-CPU film inference runs only on deliberate workflow changes.
    # Code-only pushes get light contract tests in a separate workflow.
    paths:
      - ".github/workflows/studio-ai-production.yml"
permissions:
  contents: read
  actions: read
jobs:
  model-directs-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      MODEL_REPO: SoAIHQ/Qwen3.5-4B-GGUF
      MODEL_REVISION: 0c82e2f4c9582ecd5f49c0f02a21b4d60c4ad603
      MODEL_FILE: Qwen3.5-4B-Q4_K_M.gguf
      MODEL_BYTES: 2783447136
      MODEL_SHA256: 2ebe6eb67cb92adeffc7073c48dd4e3baf79465ac650793dc751cad2b29cf219
      MODEL_DIR: models/qwen35-4b
      MODEL_ALIAS: zx7-local-director
      OUTPUT: output/autonomous-film
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Safety and project contract gates
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Resume verified idea selection and original film-spine checkpoints
        uses: actions/download-artifact@v4
        with:
          name: zx7-first-model-directed-production-evidence
          run-id: 39524196131
          github-token: ${{ github.token }}
          path: output/autonomous-film
      - name: Restore most recent verified creative checkpoints if available
        uses: actions/cache/restore@v4
        with:
          path: output/autonomous-film/creative
          key: zx7-creative-stage-v1-${{ github.run_id }}
          restore-keys: |
            zx7-creative-stage-v1-
      - name: Install real CPU production engines and archival voice SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg fonts-urw-base35 libsndfile1 curl libgomp1
          python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "soundfile>=0.12,<1" "onnxruntime>=1.19,<2" "huggingface_hub>=0.25,<2"
          python -m pip install "git+https://github.com/supertone-oss-archive/supertonic-py.git@df0f9686dac7fbbde391b759e2ee5286a3737622"
      - uses: actions/cache/restore@v4
        with:
          path: models/qwen35-4b
          key: grounded-qwen35-4b-0c82e2f4c9582ecd5f49c0f02a21b4d60c4ad603
      - name: Obtain verified pinned local film brain
        run: |
          mkdir -p "$MODEL_DIR" "$OUTPUT"
          if [ ! -f "$MODEL_DIR/$MODEL_FILE" ]; then
            curl -fL --retry 3 -sS \
              "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
              -o "$MODEL_DIR/$MODEL_FILE"
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib,os
          file=Path(os.environ["MODEL_DIR"])/os.environ["MODEL_FILE"]
          assert file.stat().st_size==int(os.environ["MODEL_BYTES"])
          with file.open("rb") as f:h=hashlib.file_digest(f,"sha256").hexdigest()
          assert h==os.environ["MODEL_SHA256"],"Model bytes not the trusted build"
          print("VERIFIED real local model weights",flush=True)
          PY
      - name: Obtain verified CPU llama inference server
        run: |
          mkdir -p /tmp/zx7-llama
          curl -fL --retry 3 -sS \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/zx7-llama/package.tar.gz
          tar -xzf /tmp/zx7-llama/package.tar.gz -C /tmp/zx7-llama
          SERVER="$(find /tmp/zx7-llama -type f -name llama-server | head -n 1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Author complete film story, screenplay, shots and actual artwork design with local model
        run: |
          "$LLAMA_SERVER" --model "$MODEL_DIR/$MODEL_FILE" \
            --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8085 \
            --ctx-size 16384 --threads 4 --parallel 1 --reasoning-budget 0 --no-webui \
            > "$OUTPUT/brain.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for i in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=2) as r:
                      if r.status==200: break
              except OSError:time.sleep(2)
          else:raise SystemExit("Offline model failed to start")
          print("LOCAL AI FILM DIRECTOR READY",flush=True)
          PY
          # A rejected screenplay remains rejected. Keep actual raw outputs, then
          # inspect its production feasibility for diagnosis without promoting it.
          python -u -m studio_next.creative_challenge \
            --brief studio_next/experiments/product.json \
            --out "$OUTPUT/creative" --model "$MODEL_ALIAS" \
            --api http://127.0.0.1:8085 --resume --segmented || echo "Original screenplay rejected or incomplete"
          if [ -f "$OUTPUT/creative/result.json" ] && python - <<'PY'
          import json
          from pathlib import Path
          p=Path("output/autonomous-film/creative/result.json")
          qa=json.loads(p.read_text())["audit"]
          assert qa.get("structural_passed") and qa.get("human_audition_candidate"), (
              "Unapproved story: production must not silently promote a rejected draft")
          PY
          then
            python -u -m studio_next.production_handoff \
              --treatment "$OUTPUT/creative/result.json" \
              --out "$OUTPUT/design" --model "$MODEL_ALIAS" \
              --api http://127.0.0.1:8085
          else
            echo "Creative output absent; retaining genuine failure evidence"
          fi
      - name: Download optional approved M3/F2 narrator only for actual production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=Path("output/autonomous-film/design/production-manifest.json")
          if not m.exists():
              raise SystemExit("No production manifest; no voice download")
          d=json.loads(m.read_text())
          if not d.get("all_designs_executable") or "delivery" not in d:
              print("Original direction is unbuildable; not downloading voice",flush=True)
              raise SystemExit(0)
          from huggingface_hub import snapshot_download
          snapshot_download("supertone-oss-archive/supertonic-3",
              revision="aafc6e32416a594460b32413efc49d7fe4ce6d46",
              local_dir="supertonic_assets",max_workers=4)
          print("VERIFIED narrator assets present",flush=True)
          PY
      - name: Execute actual model-authored 2D/3D shots and final edited film
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=Path("output/autonomous-film/design/production-manifest.json")
          if not m.exists():
              raise SystemExit("PRODUCTION BLOCKED: story phase failed")
          d=json.loads(m.read_text())
          if not d.get("all_designs_executable") or "delivery" not in d:
              raise SystemExit("PRODUCTION BLOCKED: honest unresolved art/rights/format; inspect manifest")
          PY
          python -u -m studio_next.execute_film \
            --treatment "$OUTPUT/creative/result.json" \
            --designs "$OUTPUT/design" \
            --delivery "$OUTPUT/design/delivery.json" \
            --voice-assets supertonic_assets \
            --out "$OUTPUT/render"
          python - <<'PY'
          from pathlib import Path
          import json,subprocess
          p=Path("output/autonomous-film/render/film.mp4")
          v=json.loads(subprocess.check_output(["ffprobe","-v","error",
             "-show_streams","-show_format","-of","json",str(p)]))
          assert any(x.get("codec_type")=="video" for x in v["streams"])
          assert any(x.get("codec_type")=="audio" for x in v["streams"])
          print("PHYSICAL AI-DIRECTED FILM EXISTS",p,p.stat().st_size,flush=True)
          print("Creative quality is NOT independently approved",flush=True)
          PY
      - name: Persist every verified per-stage checkpoint even on a creative failure
        uses: actions/cache/save@v4
        if: always()
        with:
          path: output/autonomous-film/creative
          key: zx7-creative-stage-v1-${{ github.run_id }}
      - name: Retain original source, rejected drafts, full design and real footage, if achieved
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zx7-first-model-directed-production-evidence
          path: output/autonomous-film/
          if-no-files-found: warn
          retention-days: 7
