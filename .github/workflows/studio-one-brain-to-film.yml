name: "ZX7 One Creative Brain — Actual Film Production Attempt"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    paths: [".github/workflows/studio-one-brain-to-film.yml"]
permissions:
  contents: read
jobs:
  independently-direct-and-produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      MODEL_REPO: DavidAU/Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF
      MODEL_REVISION: d5f3139249b7ee2535c20ab81125c9a6ab0c4915
      MODEL_FILE: Qwen3.5-9B-The-Defiant-Fable-Uncnr-Heretic-NEO-MAX-Q4_K_M.gguf
      MODEL_BYTES: "6828993824"
      MODEL_SHA256: d33db5e583b9c9251402e876443791bc979f12af934bfb0630eadfb456279f84
      MODEL_ALIAS: zx7-one-film-brain-original
      OUTPUT: output/one-brain-to-actual-film
      MODEL_DIR: models/film-brain-9b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Contract integrity: original art survives production without presets
        run: |
          python -m compileall -q studio_next motion_studio
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Install real Blender and FFmpeg CPU production tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libsndfile1 libgomp1 curl
          python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "soundfile>=0.12,<1"
      - name: Obtain and cryptographically verify only one no-paid creative model
        run: |
          mkdir -p "$MODEL_DIR" "$OUTPUT"
          curl -fL --retry 3 -sS \
            "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
            -o "$MODEL_DIR/$MODEL_FILE"
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          model=Path(os.environ["MODEL_DIR"])/os.environ["MODEL_FILE"]
          assert model.stat().st_size==int(os.environ["MODEL_BYTES"]),"Downloaded wrong checkpoint"
          with model.open("rb") as stream:
              check=hashlib.file_digest(stream,"sha256").hexdigest()
          assert check==os.environ["MODEL_SHA256"],"Unverified film-brain model bytes"
          (Path(os.environ["OUTPUT"])/"model-verified.json").write_text(json.dumps({
              "source":os.environ["MODEL_REPO"],"revision":os.environ["MODEL_REVISION"],
              "sha256":check,"license_metadata":"Apache-2.0, ungated",
              "creative_proficiency_verified":False},indent=2))
          print("ONE PINNED 9B MODEL CHECKPOINT VERIFIED",flush=True)
          PY
      - name: Obtain CPU-only local inference runner
        run: |
          mkdir -p /tmp/zx7-llama
          curl -fL --retry 3 -sS \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/zx7-llama/package.tar.gz
          tar -xzf /tmp/zx7-llama/package.tar.gz -C /tmp/zx7-llama
          SERVER="$(find /tmp/zx7-llama -type f -name llama-server | head -n 1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Film brain imagines freely, authors its own film and actual renderer directions
        run: |
          "$LLAMA_SERVER" --model "$MODEL_DIR/$MODEL_FILE" \
            --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8085 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --reasoning-budget 0 --no-webui \
            > "$OUTPUT/brain.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(120):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=3) as reply:
                      if reply.status==200:break
              except OSError:time.sleep(2)
          else:raise SystemExit("Actual 9B free local model failed to load")
          print("ONE CREATIVE INTELLIGENCE READY",flush=True)
          PY
          python -u -m studio_next.director_to_production \
            --brief studio_next/experiments/product.json \
            --model "$MODEL_ALIAS" --api http://127.0.0.1:8085 \
            --out "$OUTPUT/director"
      - name: Verify real original scene rights and actual model-authored executability
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ["OUTPUT"])/"director"
          status=json.loads((out/"handoff-result.json").read_text(encoding="utf-8"))
          print("ONE-BRAIN HONEST PRODUCTION READINESS:",json.dumps(status,indent=2),flush=True)
          if not status.get("original_vision_preserved"):
              raise SystemExit("No original film conceived by actual model")
          if not status.get("ready_for_possible_render"):
              raise SystemExit("Film is not executable as originally imagined; preserve unmet artistic needs instead of fake video")
          plan=json.loads((out/"director-translation.json").read_text())
          delivery=json.loads((out/"designs"/"delivery.json").read_text())
          assert status["translation_validated"]["scenes"]==len(plan["scenes"])
          assert delivery["voice"]==plan["voice"]["choice"]
          print("TRUE FILM PRODUCTION ELIGIBLE — ORIGINAL ART DIRECTION PRESERVED",flush=True)
          PY
      - name: Obtain original approved M3/F2 narrator only if film actually needs speech
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["OUTPUT"])/"director"
          film=json.loads((root/"director-translation.json").read_text())
          if film["voice"]["choice"]=="no_voice":
              print("FILM DIRECTOR CHOSE HONEST SILENCE",flush=True)
              raise SystemExit(0)
          if not any(s["narration"].strip() for s in film["scenes"]):
              print("NO NARRATED SHOTS",flush=True)
              raise SystemExit(0)
          Path(os.environ["OUTPUT"],"voice-required.marker").touch()
          PY
          if [ -f "$OUTPUT/voice-required.marker" ]; then
            python -m pip install "huggingface_hub>=0.25,<2" \
              "git+https://github.com/supertone-oss-archive/supertonic-py.git@df0f9686dac7fbbde391b759e2ee5286a3737622"
            python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("supertone-oss-archive/supertonic-3",
              revision="aafc6e32416a594460b32413efc49d7fe4ce6d46",
              local_dir="supertonic_assets",max_workers=4)
          PY
          fi
      - name: Render actual model-selected 2D/3D or other registered video shots
        run: |
          if [ -d supertonic_assets ]; then
            python -u -m studio_next.execute_film \
              --treatment "$OUTPUT/director/director-translation.json" \
              --designs "$OUTPUT/director/designs" \
              --delivery "$OUTPUT/director/designs/delivery.json" \
              --voice-assets supertonic_assets \
              --out "$OUTPUT/render"
          else
            python -u -m studio_next.execute_film \
              --treatment "$OUTPUT/director/director-translation.json" \
              --designs "$OUTPUT/director/designs" \
              --delivery "$OUTPUT/director/designs/delivery.json" \
              --out "$OUTPUT/render"
          fi
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          film=Path(os.environ["OUTPUT"])/"render/film.mp4"
          assert film.is_file() and film.stat().st_size>1000
          streams=json.loads(subprocess.check_output([
              "ffprobe","-v","error","-show_streams","-show_format","-of","json",str(film)]))
          assert any(s["codec_type"]=="video" for s in streams["streams"])
          assert any(s["codec_type"]=="audio" for s in streams["streams"])
          print("REAL MODEL-DIRECTED MP4 CREATED:",film,film.stat().st_size,flush=True)
          print("HUMAN FILM QUALITY IS NOT CERTIFIED",flush=True)
          PY
      - name: Always save the original vision, blocked dependencies, raw shot plans and actual video if possible
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zx7-single-original-film-brain-unedited-production-evidence
          path: output/one-brain-to-actual-film/
          if-no-files-found: warn
          retention-days: 7
