name: ZX7 BODY Original Movie Proof
on:
  workflow_dispatch:
  push:
    branches: [zx7-body/mobile-operator-20261021]
    paths:
      - studio_next/body_original_showcase.py
      - .github/workflows/studio-body-original-showcase.yml
permissions:
  contents: read
jobs:
  original-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native media and original artwork setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install 'Pillow>=10,<13' 'numpy>=1.26,<3'
          ffmpeg -version
          ffprobe -version
      - name: Render actual licensed source film via registered BODY
        run: python -m studio_next.body_original_showcase --out output/actual-original-cinema
      - name: Preserve real video and source receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-body-original-film
          path: output/actual-original-cinema/
          if-no-files-found: warn
          retention-days: 20
