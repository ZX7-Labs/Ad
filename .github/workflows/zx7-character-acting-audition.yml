name: "ZX7 BODY Original Human Character — Art Direction Audition"
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zx7-character-acting-audition.yml"
      - "examples/creative-evidence/unused-light-original-character.json"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install only missing native CGI runtimes
        run: |
          if ! command -v blender >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y blender
          fi
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          blender --version | head -n 1
          ffmpeg -version | head -n 1
      - name: Verify original character, camera, materials and all acting controls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from studio_next.blender_scene import validate_blender_shot
          from studio_next.body_integration import body_catalog
          p=Path("examples/creative-evidence/unused-light-original-character.json")
          job=json.loads(p.read_text())
          validate_blender_shot(job)
          assert job["frames"]==72 and len(job["objects"])>=35
          Path("output/creative-character").mkdir(parents=True,exist_ok=True)
          catalog=body_catalog(Path("output/creative-character"))
          print("BODY THREE-DIMENSIONAL ORIGINAL CHARACTER CONTRACT VERIFIED",flush=True)
          PY
      - name: Execute BODY native Blender cinematic character audition, no core changes
        run: |
          python -u - <<'PY'
          import json
          from pathlib import Path
          from studio_next.body_integration import body_catalog
          root=Path("output/creative-character").resolve()
          p=Path("examples/creative-evidence/unused-light-original-character.json")
          (root/"art-direction.json").write_bytes(p.read_bytes())
          body=body_catalog(root)
          result=body.invoke("body.blender3d",{"scene_json":"art-direction.json","out":"character-audition.mp4"},allowed_access={"write"})
          print("REAL BODY CHARACTER EXECUTION",json.dumps(result,default=str),flush=True)
          PY
      - name: Extract independently decoded character performance frames
        run: |
          ffmpeg -hide_banner -loglevel error -xerror -i output/creative-character/character-audition.mp4 -map 0:v:0 -frames:v 1 -y output/creative-character/first.png
          ffmpeg -hide_banner -loglevel error -xerror -ss 3 -i output/creative-character/character-audition.mp4 -map 0:v:0 -frames:v 1 -y output/creative-character/middle.png
          ffmpeg -hide_banner -loglevel error -xerror -ss 5.5 -i output/creative-character/character-audition.mp4 -map 0:v:0 -frames:v 1 -y output/creative-character/end.png
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,hashlib
          movie=Path("output/creative-character/character-audition.mp4")
          p=json.loads(subprocess.check_output(["ffprobe","-v","error","-count_frames","-show_streams","-show_format","-of","json",str(movie)]))
          v=[s for s in p["streams"] if s["codec_type"]=="video"]
          assert len(v)==1 and int(v[0]["nb_read_frames"])==72
          assert (v[0]["width"],v[0]["height"])==(480,854)
          assert abs(float(p["format"]["duration"])-6)<0.03
          subprocess.run(["ffmpeg","-v","error","-xerror","-i",str(movie),"-f","null","-"],check=True,timeout=120)
          print("VERIFIED NATIVE BODY HUMAN FIGURE",movie.stat().st_size,hashlib.sha256(movie.read_bytes()).hexdigest())
          PY
      - name: Upload cinematic acting proof only, not permanent source-repo video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-body-human-character-act-original-3D-preview
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/creative-character/character-audition.mp4
            output/creative-character/first.png
            output/creative-character/middle.png
            output/creative-character/end.png
            output/creative-character/art-direction.json
