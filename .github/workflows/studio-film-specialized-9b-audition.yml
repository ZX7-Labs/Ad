name: "ZX7 Film-Only Creative Brain — 9B Specialized Alternative Audition"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    paths: [".github/workflows/studio-film-specialized-9b-audition.yml"]
permissions:
  contents: read
jobs:
  test-creative-film-brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 66
    env:
      MODEL_REPO: DavidAU/Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF
      MODEL_REVISION: d5f3139249b7ee2535c20ab81125c9a6ab0c4915
      MODEL_FILE: Qwen3.5-9B-The-Defiant-Fable-Uncnr-Heretic-NEO-MAX-Q4_K_M.gguf
      MODEL_ALIAS: zx7-specialized-film-creative-candidate
      MODEL_DIR: models/film-specialist-9b
      OUTPUT: output/specialist-9b-audition
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Verify independent audition code, license boundaries and ordinary studio contracts
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Download only one Git-revision-pinned Apache-2.0 creative-writing model
        run: |
          mkdir -p "$MODEL_DIR" "$OUTPUT"
          curl -fL --retry 3 -sS \
            "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
            -o "$MODEL_DIR/$MODEL_FILE"
          python - <<'PY'
          import os,hashlib,json
          from pathlib import Path
          p=Path(os.environ["MODEL_DIR"])/os.environ["MODEL_FILE"]
          assert 4_000_000_000 < p.stat().st_size < 10_000_000_000, "Incomplete/implausible model weights"
          with p.open("rb") as f:sha=hashlib.file_digest(f,"sha256").hexdigest()
          proof={"repo":os.environ["MODEL_REPO"],"revision":os.environ["MODEL_REVISION"],
                 "file":os.environ["MODEL_FILE"],"bytes":p.stat().st_size,
                 "sha256":sha,
                 "hub_declared_license":"apache-2.0","hub_declared_gated":False,
                 "verified":"Pinned revision and local hash only, not creative quality"}
          Path(os.environ["OUTPUT"],"weight-evidence.json").write_text(json.dumps(proof,indent=2))
          print("SPECIALIST MODEL WEIGHT EVIDENCE",json.dumps(proof),flush=True)
          PY
      - name: Start trusted CPU inference runtime
        run: |
          mkdir -p /tmp/zx7-llama
          curl -fL --retry 3 -sS \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/zx7-llama/package.tar.gz
          tar -xzf /tmp/zx7-llama/package.tar.gz -C /tmp/zx7-llama
          SERVER="$(find /tmp/zx7-llama -type f -name llama-server | head -n 1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Evaluate unedited creative direction on independent fiction/product and educational projects
        run: |
          "$LLAMA_SERVER" --model "$MODEL_DIR/$MODEL_FILE" \
            --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8085 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --reasoning-budget 650 --no-webui \
            > "$OUTPUT/brain.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for i in range(100):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=3) as resp:
                      if resp.status==200:break
              except OSError:time.sleep(2)
          else:raise SystemExit("Specialist AI model failed to start")
          print("FILM DOMAIN CANDIDATE READY; NOT PROMOTED",flush=True)
          PY
          python -u -m studio_next.model_audition \
            --brief studio_next/experiments/product.json \
            --brief studio_next/experiments/knowledge.json \
            --model "$MODEL_ALIAS" --api http://127.0.0.1:8085 \
            --out "$OUTPUT"
      - name: Save original model-authored shots without altering artistic choices
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zx7-unedited-specialized-9b-film-audition-evidence
          path: output/specialist-9b-audition/
          if-no-files-found: warn
          retention-days: 7
