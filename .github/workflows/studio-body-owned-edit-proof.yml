name: "ZX7 BODY — Real Source-Custody Editorial Proof"
on:
  workflow_dispatch:
  push:
    branches: [zx7-body/mobile-operator-20261021]
    paths:
      - "studio_next/**"
      - ".github/workflows/studio-body-owned-edit-proof.yml"
      - "studio_next/body_owned_edit.py"
      - "studio_next/test_body_owned_edit.py"
      - "studio_next/test_body_signal.py"
      - "studio_next/composite_mix.py"
      - "studio_next/test_composite_mix.py"
      - "studio_next/body_archive.py"
      - "studio_next/test_body_archive.py"
      - "studio_next/test_body_custody_graph.py"
      - "studio_next/body_integration.py"
      - "studio_next/body_publication.py"
      - "studio_next/body_materials.py"
      - "studio_next/edit_timeline.py"
      - "studio_next/test_body_integration.py"
      - "studio_next/media_vault.py"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-verified-cuts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Provision genuine original picture, soundtrack and PNG decoders
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --disable-pip-version-check "Pillow>=10,<13"
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Test decoded original sound and video, owner custody, producer-only vault, crash reuse and races
        shell: bash
        run: |
          set -o pipefail
          mkdir -p output/source-custody-proof
          python -m compileall -q studio_next
          python -m unittest studio_next.test_body_loudness.NativeSoundLevelProof.test_loudness_analyzer_reads_attested_cas_not_mutable_owner_movie_checkout studio_next.test_body_color_pipeline.PhysicalFilmColorLutTests.test_actual_lut_grade_decodes_frozen_cas_while_mutable_original_is_swapped studio_next.test_body_color_pipeline.PhysicalFilmColorLutTests.test_lut_grade_cannot_destroy_already_published_concurrent_artist_master studio_next.test_film_finishing.IndependentFilmFinishingTests.test_color_and_sound_finisher_consumes_only_sealed_original_source_even_if_checkout_is_swapped studio_next.test_film_finishing.IndependentFilmFinishingTests.test_another_editor_accepted_master_is_not_deleted_on_finishing_collision studio_next.test_precision_retime.PhysicalRetimeTests.test_mutable_camera_checkout_swap_during_real_speed_render_keeps_original_frame_audio studio_next.test_precision_retime.PhysicalRetimeTests.test_concurrent_master_is_not_unlinked_by_losing_speed_editor studio_next.test_precision_retime.PhysicalRetimeTests.test_original_video_longer_than_original_audio_not_preserved_by_speed_map studio_next.test_body_signal.RealConnectedBrainToOwnedCinemaTests studio_next.test_body_owned_edit studio_next.test_body_custody_graph studio_next.test_body_sequence_cuts.RealOwnedSequenceCuts.test_original_camera_picture_longer_than_recorded_sound_cannot_claim_preserved_audio studio_next.test_body_sequence_cuts.RealOwnedSequenceCuts.test_encoder_only_reads_sealed_rights_attested_original_sources_despite_checkout_swap studio_next.test_body_sequence_cuts.RealOwnedSequenceCuts.test_concurrent_accepted_movie_cannot_be_unlinked_when_new_encode_loses_race studio_next.test_body_archive studio_next.test_body_integration studio_next.test_composite_mix.LayeredProductionCompositingTests.test_mutable_checkout_swap_cannot_change_cas_sealed_camera_or_sound studio_next.test_composite_mix.LayeredProductionCompositingTests.test_real_layer_source_duration_boundaries_before_render studio_next.test_composite_mix.LayeredProductionCompositingTests.test_camera_movie_longer_than_its_audio_cannot_invent_missing_sound studio_next.test_composite_mix.LayeredProductionCompositingTests.test_exact_attested_original_still_can_animate_over_sound_without_video_forgery -v 2>&1 | tee output/source-custody-proof/actual-codec-tests.log
          grep -E '^OK( \(skipped=[0-9]+\))?$' output/source-custody-proof/actual-codec-tests.log
          if grep -E '^OK \(skipped=[1-9][0-9]*\)$' output/source-custody-proof/actual-codec-tests.log; then
            echo "Codec-specific source rights proof may not be skipped" >&2
            exit 1
          fi
      - name: Retain physical proof logs, including test failure reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-original-source-custody-editorial-proof
          path: output/source-custody-proof/
          if-no-files-found: warn
          retention-days: 7
