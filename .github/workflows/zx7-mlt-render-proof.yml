name: ZX7 Native MLT Video Renderer and Source Proof
on:
  pull_request:
    branches: [main]
    paths:
      - "studio_next/**"
      - ".github/workflows/zx7-mlt-render-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-mlt-render-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  render-verified-original-layered-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source native editor and physical media decoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y melt ffmpeg frei0r-plugins
      - name: Compile trusted BODY implementation and exact tool interfaces
        run: python -m compileall -q studio_next
      - name: Prove MLT original source-to-verified MP4 rendering
        run: |
          python -m unittest studio_next.test_body_mlt_editor studio_next.test_body_mlt_pan studio_next.test_body_mlt_transform studio_next.test_body_mlt_masks studio_next.test_body_mlt_relink -v
          python -m unittest studio_next.test_body_sequence_cuts studio_next.test_body_tool_contracts -v
      - name: Verify render failure never leaves untrusted output
        run: |
          python -m unittest studio_next.test_body_mlt_editor.VerifiedMLTEditorialTests.test_failed_mlt_render_cannot_publish_partial_final_movie -v
