name: "Voice Lab — XTTS research retry"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voice-xtts-retry.yml"
permissions:
  contents: read
  actions: read
jobs:
  voice-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COQUI_TOS_AGREED: "1"
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Reference audio from prior open source sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice_lab/reference
          gh run download 39398231080 --repo "$GITHUB_REPOSITORY" --name voice-deep-three-way-comparison --dir voice_lab/reference
          test -s voice_lab/reference/stuart_bell-raw.wav
      - name: Install CPU audio synthesis and codec
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio torchcodec --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "coqui-tts[codec]>=0.27,<0.29" "transformers<5" soundfile
      - name: Generate research-only XTTS voice
        run: python -u voice_lab/compare_f5_xtts.py --model xtts
      - name: Include mandatory license notice
        run: |
          echo "XTTS-v2 model/output Coqui Public Model License, non-commercial only" > voice_lab/comparison/LICENSE-NOTICE.txt
          echo "https://huggingface.co/coqui/XTTS-v2/blob/main/LICENSE.txt" >> voice_lab/comparison/LICENSE-NOTICE.txt
          echo "Not for commercial videos." >> voice_lab/comparison/LICENSE-NOTICE.txt
      - name: Upload test
        uses: actions/upload-artifact@v4
        with:
          name: noncommercial-voice-xtts-retry
          path: voice_lab/comparison/
          retention-days: 7
