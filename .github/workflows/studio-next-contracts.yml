name: "Next Studio Architecture — Contract and Security Tests"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studio_next/**"
      - ".github/workflows/studio-next-contracts.yml"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile isolated architecture
        run: |
          python -m compileall -q studio_next
      - name: Execute real independent security/creative-contract tests
        run: |
          python -m unittest discover -s studio_next -p "test_*.py" -v
