name: "Sample Film — ZX7 Marketing Agency"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zx7-marketing-film.yml"
permissions:
  contents: read
jobs:
  render-marketing-ad:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install video and voice dependencies (CPU, zero API fee)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-urw-base35 libsndfile1
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "soundfile>=0.12,<1" "onnxruntime>=1.19,<2" "huggingface_hub>=0.25,<2"
          python -m pip install "git+https://github.com/supertone-oss-archive/supertonic-py.git@df0f9686dac7fbbde391b759e2ee5286a3737622"
      - name: Check scene graph and all sound/narration instructions
        run: |
          python -m py_compile motion_studio/render.py motion_studio/voice.py
          python - <<'PY'
          from pathlib import Path
          import json
          p=json.loads(Path("motion_studio/projects/zx7-marketing-sample.json").read_text())
          assert p["voice"]=="M3" and p["direction_source"].startswith("Agent-authored")
          assert len(p["scenes"])==6
          for s in p["scenes"]:
              assert len(s["narration"].split())<25,(s["id"],s["narration"])
              assert s["min_seconds"]>=4
              assert all(z["asset"] in p["assets"] for z in s["layers"])
              for z in s["layers"]:
                  for track in z.get("animate",{}).values():
                      assert all(left[0]<right[0] for left,right in zip(track,track[1:])),s["id"]
          print("PASS original marketing scene graph: 6 creative shots, approved M3",flush=True)
          PY
      - name: Cache 99M voice assets
        uses: actions/cache@v4
        with:
          path: supertonic_assets
          key: supertonic3-aafc6e32416a594460b32413efc49d7fe4ce6d46
      - name: Download archived Supertonic model for agreed M3 narration
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          print(snapshot_download("supertone-oss-archive/supertonic-3",
              revision="aafc6e32416a594460b32413efc49d7fe4ce6d46",
              local_dir="supertonic_assets",max_workers=4))
          PY
      - name: Synthesize approved male M3 voice and preserve measurements
        run: |
          python -u -m motion_studio.voice \
            --project motion_studio/projects/zx7-marketing-sample.json \
            --model-dir supertonic_assets \
            --out output/zx7-marketing
      - name: Render full marketing film with motion, audio and score
        run: |
          python -u -m motion_studio.render \
            --project motion_studio/projects/zx7-marketing-sample.json \
            --out output/zx7-marketing \
            --width 1080 --fps 24
      - name: Technical video verification
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          target=Path("output/zx7-marketing/sample.mp4")
          p=json.loads(subprocess.check_output([
            "ffprobe","-v","error","-show_streams","-show_format",
            "-of","json",str(target)]))
          vs=[s for s in p["streams"] if s.get("codec_type")=="video"]
          au=[s for s in p["streams"] if s.get("codec_type")=="audio"]
          assert vs and au
          assert (vs[0]["width"],vs[0]["height"])==(1080,1920)
          assert 18<float(p["format"]["duration"])<48
          assert target.stat().st_size>150000
          print("VALIDATED",target,round(float(p["format"]["duration"]),2),
                "sec",round(target.stat().st_size/1e6,2),"MB",flush=True)
          PY
      - name: Upload real playable MP4 plus production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZX7-marketing-ad-sample-MP4
          path: |
            output/zx7-marketing/sample.mp4
            output/zx7-marketing/render-manifest.json
            output/zx7-marketing/voice-timing.json
            output/zx7-marketing/frames/*.jpg
          if-no-files-found: warn
          retention-days: 7
