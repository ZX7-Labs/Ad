name: "ZX7 BODY — Mobile Console Security Contract"
on:
  workflow_dispatch:
  push:
    branches: [zx7-body/mobile-operator-20261021]
    paths:
      - "studio_next/body_mobile.py"
      - "studio_next/body_download_tickets.py"
      - "studio_next/test_body_download_tickets.py"
      - "studio_next/body_service.py"
      - "studio_next/test_body_mobile.py"
      - ".github/workflows/studio-mobile-contracts.yml"
permissions:
  contents: read
jobs:
  mobile-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile server and serve static shell with protected APIs
        run: |
          python -m compileall -q studio_next
          python -m unittest studio_next.test_body_mobile studio_next.test_body_download_tickets -v
      - name: Parse actual client JavaScript in Node
        run: |
          python - <<'PY'
          from studio_next.body_mobile import SCRIPT
          from pathlib import Path
          Path("/tmp/zx7-studio.js").write_text(SCRIPT)
          PY
          node --check /tmp/zx7-studio.js
