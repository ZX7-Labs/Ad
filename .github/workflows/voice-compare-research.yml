name: "Voice Lab — F5 vs XTTS (non-commercial listening)"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  voice-evaluation:
    strategy:
      fail-fast: false
      matrix:
        model: [f5, xtts]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    name: "Research / ${{ matrix.model }}"
    env:
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      COQUI_TOS_AGREED: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install audio system libs
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libsndfile1 espeak-ng
      - name: Download same voice reference from earlier test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice_lab/reference
          gh run download 39398231080 --repo "$GITHUB_REPOSITORY" --name voice-deep-three-way-comparison --dir voice_lab/reference
          test -s voice_lab/reference/stuart_bell-raw.wav
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install F5 official inference
        if: matrix.model == 'f5'
        run: python -m pip install f5-tts soundfile
      - name: Install maintained Coqui inference
        if: matrix.model == 'xtts'
        run: python -m pip install "coqui-tts>=0.27,<0.29" "transformers<5" soundfile
      - name: Validate licensing and scripts
        run: |
          python -m py_compile voice_lab/compare_f5_xtts.py
          echo "Research test only. F5 model CC BY-NC 4.0. XTTS model CPML non-commercial."
      - name: Generate personal listening sample
        run: python -u voice_lab/compare_f5_xtts.py --model "${{ matrix.model }}"
      - name: Include licenses in sample
        if: success()
        run: |
          echo "PERSONAL NON-COMMERCIAL EVALUATION ONLY" > voice_lab/comparison/LICENSE-NOTICE.txt
          echo "F5-TTS model checkpoints: CC BY-NC 4.0 https://creativecommons.org/licenses/by-nc/4.0/" >> voice_lab/comparison/LICENSE-NOTICE.txt
          echo "XTTS-v2 model AND its outputs: Coqui CPML https://huggingface.co/coqui/XTTS-v2/blob/main/LICENSE.txt" >> voice_lab/comparison/LICENSE-NOTICE.txt
          echo "Reference source: Kyutai CC0 voice-zero -> MIT Chatterbox Nano synthetic audio" >> voice_lab/comparison/LICENSE-NOTICE.txt
          echo "Not permitted for AD Studio business/monetized/commercial exports." >> voice_lab/comparison/LICENSE-NOTICE.txt
      - name: Upload audio
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: "noncommercial-voice-${{ matrix.model }}"
          path: voice_lab/comparison/
          retention-days: 7
