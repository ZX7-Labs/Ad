name: "Voice Lab — Deep Male Chatterbox Nano"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voice-deep.yml"
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libsndfile1
      - name: Install CPU-only PyTorch and open-source voice engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "numpy>=1.26,<3" "soundfile>=0.12,<1" "huggingface-hub>=0.25,<2"
          python -m pip install "git+https://github.com/resemble-ai/chatterbox.git"
      - name: Cache downloaded speech model and CC0 voice references
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-nano-voice-zero-2026-oct
      - name: Compile voice test
        run: python -m py_compile voice_lab/deep_nano.py
      - name: Generate three male voices from CC0 voice references
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: python -u voice_lab/deep_nano.py
      - name: Validate audio
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          for name in ["bill_boerst","peter_yearsley","stuart_bell"]:
              f=Path("voice_lab/deep_samples")/(name+"-raw.wav")
              a=sf.info(str(f))
              assert a.channels==1 and a.duration>=3,(f,a)
              print(name,round(a.duration,1),"sec PASS")
          PY
      - name: Upload comparison WAV and MP3
        uses: actions/upload-artifact@v4
        with:
          name: voice-deep-three-way-comparison
          path: voice_lab/deep_samples/
          retention-days: 7
