name: "Voice Lab — Lightweight Supertonic 3"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/voice-supertonic3.yml"
permissions:
  contents: read
jobs:
  audition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout Voice Lab
        uses: actions/checkout@v5
      - name: Python runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install permissive audio libraries and SDK
        run: |
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub soundfile
          python -m pip install "git+https://github.com/supertone-oss-archive/supertonic-py.git@df0f9686dac7fbbde391b759e2ee5286a3737622"
      - name: Cache archived 99M open-weight model
        uses: actions/cache@v4
        with:
          path: supertonic_assets
          key: supertonic3-aafc6e32416a594460b32413efc49d7fe4ce6d46
      - name: Get archived model assets with pinned commit
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          path=snapshot_download("supertone-oss-archive/supertonic-3",
             revision="aafc6e32416a594460b32413efc49d7fe4ce6d46",
             local_dir="supertonic_assets",max_workers=4)
          print("Model files:",path)
          PY
      - name: Create short tech creator samples
        run: python -u voice_lab/audition_supertonic3.py
      - name: Validate actual audio files
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          for voice in ("m3","f2"):
            path=Path("voice_lab/supertonic_results")/(voice+"-tech-explainer.wav")
            f=sf.info(path)
            assert f.duration>7 and f.channels==1
            assert path.with_suffix(".mp3").stat().st_size>20000
            print("PASS",voice,round(f.duration,2),"sec")
          PY
      - name: Finish approved narrators with gentle studio EQ (preserve raw)
        run: |
          python voice_lab/studio_finish.py \
            --input-dir voice_lab/supertonic_results \
            --output-dir voice_lab/supertonic_results/studio
      - name: Share male and female audio
        uses: actions/upload-artifact@v6
        with:
          name: supertonic3-tech-narration
          path: voice_lab/supertonic_results/
          retention-days: 7
