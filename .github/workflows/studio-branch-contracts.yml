name: "Studio Next Branch — Contract Regression"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m compileall -q studio_next
      - run: python -m unittest discover -s studio_next -p 'test_*.py' -v
