name: "ZX7 BODY — Live Local Model Native Editor Trial"
on:
  workflow_dispatch:
    inputs:
      model_variant:
        description: "Pinned local CPU creative brain for independent evaluation"
        required: true
        type: choice
        default: qwen3.5-2b
        options:
          - qwen3.5-2b
          - qwen3.5-4b
  pull_request:
    # An explicit internal-PR title marker opts into a physical model run.
    # The edit event allows a maintainer to opt in after source CI is green.
    types: [opened, synchronize, reopened, edited]
    branches: [main]
    paths:
      - ".github/workflows/zx7-live-native-model.yml"
      - "engines/velorn/local-model-trial-4b.candidate.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/zx7-live-native-model.yml"
      - "scripts/run_native_model_trial.py"
      - "engines/velorn/local-model-trial.lock.json"
      - "studio_next/native_action_schema.py"
      - "studio_next/native_creative_control.py"
      - "studio_next/providers.py"
permissions:
  contents: read
concurrency:
  group: zx7-live-native-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned-candidate-manifest-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify bounded self-hostable model choices without downloading weights
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cases = (
              ("engines/velorn/local-model-trial.lock.json",
               "unsloth/Qwen3.5-2B-GGUF"),
              ("engines/velorn/local-model-trial-4b.candidate.json",
               "unsloth/Qwen3.5-4B-GGUF"),
          )
          for filename, model_id in cases:
              data = json.loads(Path(filename).read_text())
              assert data["schema"] == 1 and data["model"]["id"] == model_id
              assert data["model"]["license"] == "Apache-2.0"
              assert data["server"]["host"] == "127.0.0.1"
              assert data["runtime"]["source_commit"] == "68d20b884c3878217de79eade0a249efde96ab38"
              assert all(len(x["sha256"]) == 64 and
                         (x.get("bytes", x.get("max_bytes", 0)) > 0)
                         for x in data["model"]["files"])
              assert "--n-gpu-layers" in data["server"]["args"]
              assert data["server"]["args"][data["server"]["args"].index(
                  "--n-gpu-layers") + 1] == "0"
          print("Both source-pinned, bounded local CPU candidate contracts are present")
          PY
  actual-local-model-and-native-editor:
    # Never launch the heavyweight neural trial for arbitrary public forks.
    # Opt in by putting [native-model-proof] in an internal PR title, or by
    # explicit workflow_dispatch as before. No model action is pre-scripted.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.title, '[native-model-proof]')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact BODY and complete pinned editor source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install native display, codecs and declared local protocol dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth x11-xkb-utils xkb-data \
            libnss3 libatk-bridge2.0-0 libasound2t64 libgtk-3-0 \
            libgbm1 libxss1 libxdamage1 libxcomposite1 libxrandr2 libx11-xcb1
          python -m pip install --no-cache-dir '.[editor,production]'
      - name: Verify source pin and ordinary non-root execution identity
        run: |
          test "$(id -u)" -ne 0
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
          python --version
          node --version
      - name: Build existing production editor from its pinned source
        working-directory: third_party/velorn
        run: |
          npm ci --no-audit --no-fund
          npm run build
          test -s dist/index.html
      - name: Enable the intended Chromium sandbox helper
        working-directory: third_party/velorn
        run: |
          helper="$PWD/node_modules/electron/dist/chrome-sandbox"
          test -f "$helper"
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%a' "$helper")" = "0:4755"
      - name: Run identified CPU model with real native editor and source-bound observations
        env:
          # A separately opted-in internal PR can compare the pinned 4B
          # CPU model without editing code or involving a hosted AI API.
          # No title marker: preserve the existing explicit dispatch choice.
          MODEL_VARIANT: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[native-model-4b]') && 'qwen3.5-4b' || inputs.model_variant || 'qwen3.5-2b' }}
        run: |
          # Exact source-pinned model choices only; no arbitrary user-supplied
          # paths, shell code, hosted inference, or unverifiable weights.
          case "$MODEL_VARIANT" in
            qwen3.5-2b) model_lock="engines/velorn/local-model-trial.lock.json" ;;
            qwen3.5-4b) model_lock="engines/velorn/local-model-trial-4b.candidate.json" ;;
            *) echo "Unknown pinned local model variant" >&2; exit 2 ;;
          esac
          python -u scripts/run_native_model_trial.py \
            --model-lock "$GITHUB_WORKSPACE/$model_lock" \
            --source "$GITHUB_WORKSPACE/third_party/velorn" \
            --runtime "$RUNNER_TEMP/zx7-model-runtime" \
            --artifacts "$GITHUB_WORKSPACE/output/live-native-model" \
            --xvfb-binary /usr/bin/Xvfb \
            --display 127.0.0.1:95
      - name: Verify the pinned editor source remains unchanged
        if: always()
        run: |
          test "$(git -C third_party/velorn rev-parse HEAD)" = "b3c02adbd5c0779feb8abf34978299e9502cc0e7"
          git -C third_party/velorn diff --exit-code HEAD --
      - name: Preserve actual trial results, including failures, without model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-live-native-model-${{ github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[native-model-4b]') && 'qwen3.5-4b' || inputs.model_variant || 'qwen3.5-2b' }}-${{ github.sha }}
          path: output/live-native-model/
          if-no-files-found: warn
          retention-days: 14
