name: Director contract regression tests
on:
  push:
    branches: [main]
    paths:
      - "creative_director/**"
      - "director_research/**"
      - ".github/workflows/director-checks.yml"
  pull_request:
    paths:
      - "creative_director/**"
      - "director_research/**"
      - ".github/workflows/director-checks.yml"
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r director_research/requirements.txt
      - run: python -m unittest discover -s director_research -p 'test_*.py' -v
      - run: python -m unittest discover -s creative_director -p 'test_*.py' -v
