name: "ZX7 — Independent 9B Film Director Audition (No Creative Templates)"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    paths: [".github/workflows/studio-director-model-audition.yml"]
permissions:
  contents: read
jobs:
  original-film-brain-audition:
    # Public repo: official GitHub standard free Ubuntu CPU, not an unlimited GPU.
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      MODEL_REPO: unsloth/Qwen3.5-9B-GGUF
      MODEL_REVISION: 3885219b6810b007914f3a7950a8d1b469d598a5
      MODEL_FILE: Qwen3.5-9B-Q4_K_M.gguf
      MODEL_BYTES: "5680522464"
      MODEL_SHA256: 03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
      MODEL_DIR: models/qwen35-9b
      MODEL_ALIAS: zx7-independent-9b-film-director
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify complete studio contract suite
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Restore an already verified 9B checkpoint if available
        uses: actions/cache/restore@v4
        with:
          path: models/qwen35-9b
          key: grounded-qwen35-9b-3885219b6810b007914f3a7950a8d1b469d598a5
      - name: Obtain cryptographically pinned Apache-2.0 9B GGUF
        run: |
          mkdir -p "$MODEL_DIR" output/independent-9b-audition
          if [ ! -f "$MODEL_DIR/$MODEL_FILE" ]; then
            curl -fL --retry 3 -sS \
              "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
              -o "$MODEL_DIR/$MODEL_FILE"
          fi
          python - <<'PY'
          from pathlib import Path
          import os,hashlib
          p=Path(os.environ["MODEL_DIR"])/os.environ["MODEL_FILE"]
          assert p.stat().st_size==int(os.environ["MODEL_BYTES"]), "Model weight length changed"
          with p.open("rb") as f: sha=hashlib.file_digest(f,"sha256").hexdigest()
          assert sha==os.environ["MODEL_SHA256"], "Model weights differ from approved reference"
          print("PINNED 9B WEIGHTS VERIFIED",p,flush=True)
          PY
      - name: Install previously proven free CPU inference engine
        run: |
          mkdir -p /tmp/zx7-llama
          curl -fL --retry 3 -sS \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/zx7-llama/package.tar.gz
          tar -xzf /tmp/zx7-llama/package.tar.gz -C /tmp/zx7-llama
          SERVER="$(find /tmp/zx7-llama -type f -name llama-server | head -n 1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Audition one replaceable film brain on two very different actual tasks
        run: |
          "$LLAMA_SERVER" --model "$MODEL_DIR/$MODEL_FILE" \
            --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8085 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --reasoning-budget 650 --no-webui \
            > output/independent-9b-audition/brain.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=3) as reply:
                      if reply.status==200:break
              except OSError:time.sleep(2)
          else:raise SystemExit("Pinned 9B CPU model failed to load")
          print("ORIGINAL FILM AUDITION MODEL READY",flush=True)
          PY
          python -u -m studio_next.model_audition \
            --brief studio_next/experiments/product.json \
            --brief studio_next/experiments/knowledge.json \
            --model "$MODEL_ALIAS" --api http://127.0.0.1:8085 \
            --out output/independent-9b-audition
      - name: Preserve unedited original thoughts and explicitly unapproved status
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zx7-stronger-9b-independent-film-story-audition
          path: output/independent-9b-audition/
          if-no-files-found: warn
          retention-days: 7
