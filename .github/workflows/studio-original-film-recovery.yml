name: "ZX7 Resume Original Film — Same Director Technical Recovery"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    paths: [".github/workflows/studio-original-film-recovery.yml"]
permissions:
  contents: read
  actions: read
jobs:
  continue-the-same-film:
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    env:
      MODEL_REPO: DavidAU/Qwen3.5-9B-The-Defiant-Fable-Uncensored-Heretic-NEO-IMATRIX-MAX-MTP-GGUF
      MODEL_REVISION: d5f3139249b7ee2535c20ab81125c9a6ab0c4915
      MODEL_FILE: Qwen3.5-9B-The-Defiant-Fable-Uncnr-Heretic-NEO-MAX-Q4_K_M.gguf
      MODEL_BYTES: "6828993824"
      MODEL_SHA256: d33db5e583b9c9251402e876443791bc979f12af934bfb0630eadfb456279f84
      MODEL_ALIAS: zx7-one-film-brain-original
      MODEL_DIR: models/film-brain-9b
      OUT: output/unchanged-original-film-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Confirm technical contracts, no artificial creative rules
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Download actual original six-shot director output without reimagining
        uses: actions/download-artifact@v4
        with:
          name: zx7-single-original-film-brain-unedited-production-evidence
          run-id: 39541436321
          github-token: ${{ github.token }}
          path: source-artifact
      - name: Verify original complete saved vision and real rejected scene jobs
        run: |
          test -s source-artifact/director/original-vision/director-original.txt
          test -s source-artifact/director/director-translation.json
          test -s source-artifact/director/designs/production-manifest.json
          mkdir -p "$OUT"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("source-artifact/director/director-translation.json")
          film=json.loads(p.read_text(encoding="utf-8"))
          prior=json.loads(Path("source-artifact/director/designs/production-manifest.json").read_text())
          assert len(film["scenes"])==len(prior["designs"])
          assert [x["id"] for x in film["scenes"]]==prior["original_scene_ids"]
          print("UNEDITED ORIGINAL MODEL-CHOSEN SCENES VERIFIED",len(film["scenes"]),
                "sha256",hashlib.sha256(p.read_bytes()).hexdigest(),flush=True)
          PY
      - name: Start one legally downloadable pinned 9B film artist, not new creative personas
        run: |
          mkdir -p "$MODEL_DIR" /tmp/zx7-llama
          curl -fL --retry 3 -sS \
            "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
            -o "$MODEL_DIR/$MODEL_FILE"
          python - <<'PY'
          import os,hashlib
          from pathlib import Path
          p=Path(os.environ["MODEL_DIR"])/os.environ["MODEL_FILE"]
          assert p.stat().st_size==int(os.environ["MODEL_BYTES"])
          with p.open("rb") as source:
              assert hashlib.file_digest(source,"sha256").hexdigest()==os.environ["MODEL_SHA256"]
          print("ORIGINAL FILM ARTIST MODEL SHA256 VERIFIED",flush=True)
          PY
          curl -fL --retry 3 -sS \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/zx7-llama/package.tar.gz
          tar -xzf /tmp/zx7-llama/package.tar.gz -C /tmp/zx7-llama
          SERVER="$(find /tmp/zx7-llama -type f -name llama-server | head -n 1)"
          test -n "$SERVER"
          echo "LLAMA_SERVER=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Ask same film artist to correct only rejected renderer jobs, never its story
        run: |
          "$LLAMA_SERVER" --model "$MODEL_DIR/$MODEL_FILE" \
            --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8085 \
            --ctx-size 16384 --threads 4 --parallel 1 \
            --reasoning-budget 0 --no-webui \
            > "$OUT/recovery-brain.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(110):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=3) as answer:
                      if answer.status==200:break
              except OSError:time.sleep(2)
          else:raise SystemExit("Pinned local artist not running")
          print("SAME DIRECTOR READY FOR TECHNICAL REWORK ONLY",flush=True)
          PY
          python -u -m studio_next.recover_production \
            --saved-director source-artifact/director \
            --brief studio_next/experiments/product.json \
            --model "$MODEL_ALIAS" --api http://127.0.0.1:8085 \
            --out "$OUT"
      - name: Independently check if unchanged film has actually become executable
        id: readiness
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ["OUT"])
          p=json.loads((root/"recovery-manifest.json").read_text())
          assert p["original_film_story_unchanged"] and p["original_director_shots_unchanged"]
          assert p["original_scene_count"]==p["result_scene_count"]
          ready=p["all_designs_executable"]
          print("SAME FILM PRODUCTION READY",ready,flush=True)
          if not ready:
              print("REAL ORIGINAL FILM STILL BLOCKED: ",json.dumps(
                  [x for x in p["designs"] if not x["executable"]],ensure_ascii=False),flush=True)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write(f"render_ready={'true' if ready else 'false'}\n")
          PY
      - name: Install only actual production dependencies if the whole original film is render-ready
        if: steps.readiness.outputs.render_ready == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libsndfile1 libgomp1
          python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13" "soundfile>=0.12,<1"
          python - <<'PY'
          import json
          from pathlib import Path
          treatment=json.loads(Path("source-artifact/director/director-translation.json").read_text())
          if treatment["voice"]["choice"] not in ("M3","F2"):
              raise SystemExit(0)
          if not any(x.get("narration","").strip() for x in treatment["scenes"]):
              raise SystemExit(0)
          Path("narration-required.marker").touch()
          PY
          if [ -f narration-required.marker ]; then
            python -m pip install "huggingface_hub>=0.25,<2" \
              "git+https://github.com/supertone-oss-archive/supertonic-py.git@df0f9686dac7fbbde391b759e2ee5286a3737622"
            python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download("supertone-oss-archive/supertonic-3",
              revision="aafc6e32416a594460b32413efc49d7fe4ce6d46",
              local_dir="supertonic_assets",max_workers=4)
          PY
          fi
      - name: Render exact saved director story only if it actually passes capability checks
        if: steps.readiness.outputs.render_ready == 'true'
        run: |
          mkdir -p "$OUT/render"
          if [ -d supertonic_assets ]; then
            python -u -m studio_next.execute_film \
              --treatment "$OUT/original-preserved/director-translation.json" \
              --designs "$OUT" --delivery "$OUT/delivery.json" \
              --owner-brief studio_next/experiments/product.json \
              --voice-assets supertonic_assets --out "$OUT/render"
          else
            python -u -m studio_next.execute_film \
              --treatment "$OUT/original-preserved/director-translation.json" \
              --designs "$OUT" --delivery "$OUT/delivery.json" \
              --owner-brief studio_next/experiments/product.json \
              --out "$OUT/render"
          fi
          ffprobe -v error -show_format -show_streams -of json "$OUT/render/film.mp4" > "$OUT/real-mp4-proof.json"
          test -s "$OUT/render/film.mp4"
          echo "ACTUAL MODEL-CHOSEN FILM RENDERED, HUMAN QUALITY STILL UNREVIEWED"
      - name: Archive all original art, unchanged scene IDs, verified render gaps and actual MP4 if achieved
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-resumed-original-art-real-media-or-specific-blockers
          path: output/unchanged-original-film-recovery/
          if-no-files-found: warn
          retention-days: 7
