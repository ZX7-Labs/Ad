name: ZX7 Pull Request Source and Native Project Gate
on:
  pull_request:
    branches: [main]
    paths:
      - "studio_next/**"
      - "motion_studio/**"
      - "engines/**"
      - "third_party/**"
      - ".gitmodules"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/zx7-pr-source-contracts.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-pr-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-and-native-project:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared production-contract and audit parser dependencies
        run: python -m pip install --no-cache-dir '.[production,editor]' 'PyYAML>=6,<7'
      - name: Install actual native FFmpeg encoder for decoder-backed output check
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Compile all checked-in Python source
        run: python -m compileall -q studio_next motion_studio creative_director director_research voice_lab src scripts
      - name: Native editor transport, BODY grants and unchanged native schemas
        run: python -m unittest studio_next.test_body_editor_client studio_next.test_body_editor_catalog studio_next.test_body_editor_policy studio_next.test_body_editor_mcp studio_next.test_body_editor_export studio_next.test_body_editor_frame studio_next.test_delivery_audit -v
      - name: Local editor adapter path and tool policy
        run: node --test engines/velorn/*.test.mjs
      - name: Fast exact source-frame algebra and model-authored NLE ABI regression
        run: |
          python -m unittest studio_next.test_body_mlt_linked_actions studio_next.test_body_mlt_local_edits studio_next.test_body_mlt_placements studio_next.test_body_mlt_pan.NativeStereoPanTests.test_pan_is_explicit_finite_typed_source_animation_not_filter_syntax studio_next.test_body_mlt_pan.NativeStereoPanTests.test_ripple_keeps_original_stereo_position_at_every_source_frame -v
      - name: Prove source-frame diff is exact and AI queries cannot dump unrelated private clips
        run: |
          python -m unittest \
            studio_next.test_body_mlt_compare.ExactNativeEditorialReviewTests.test_source_address_interval_sweep_is_frame_exact_without_frame_explosion \
            studio_next.test_body_mlt_compare.ExactNativeEditorialReviewTests.test_bounded_model_queries_do_not_dump_all_private_clip_graphs -v
      - name: Verify no-drop or dropped-LABEL-only SMPTE clocks, 24h bounds and signed source-frame API
        run: python -m unittest studio_next.test_body_timecode -v
      - name: Reject rounded NTSC source clocks before real retime execution
        run: python -m unittest studio_next.test_exact_retime_clock -v
      - name: Verify typed layer geometry, immutable revisions and exact source-frame animation through ripple
        run: python -m unittest studio_next.test_body_mlt_transform studio_next.test_body_mlt_masks studio_next.test_body_mlt_relink -v
      - name: Validate current Git tracked source inventory
        run: |
          python -m unittest discover -s scripts -p 'test_repo_audit.py' -v
          python scripts/repo_audit.py --out /tmp/zx7-pr-source-inventory.json
      - name: Verify native project publish, custody and capability contracts
        run: |
          python -m unittest \
            studio_next.test_body_motion_project \
            studio_next.test_body_host_resources \
            studio_next.test_body_capabilities \
            studio_next.test_body_tool_contracts -v

  python311-original-wav:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original-audio source inspection and real decoders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --no-cache-dir '.[production]'
      - name: Prove interpreter-independent original PCM and unchanged 5.1 safety
        run: |
          python -m unittest \
            studio_next.test_media_vault.MediaVaultProductionTests.test_multichannel_extensible_pcm_keeps_exact_samples_on_python_311 \
            studio_next.test_media_vault.MediaVaultProductionTests.test_wav_cannot_claim_unrecorded_pcm_audio_samples \
            studio_next.test_body_mlt_editor.VerifiedMLTEditorialTests.test_native_pcm_wav_multichannel_is_not_silently_downmixed -v

  python311-no-ffmpeg-source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify native fixed-width PCM custody and portable owner rights without multimedia engines
        run: |
          python -m unittest \
            studio_next.test_media_vault.MediaVaultProductionTests.test_complete_integer_pcm_rights_survive_missing_ffmpeg_without_unsafe_fallback \
            studio_next.test_media_vault.MediaVaultProductionTests.test_wav_cannot_claim_unrecorded_pcm_audio_samples \
            studio_next.test_body_portability \
            studio_next.test_body_asset_identity -v
