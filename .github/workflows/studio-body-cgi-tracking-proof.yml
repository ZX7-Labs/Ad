name: "ZX7 BODY — Installed CGI, Planar VFX and Reference Input Proof"
on:
  workflow_dispatch:
  push:
    branches: [zx7-body/mobile-operator-20261021]
    paths:
      - ".github/workflows/studio-body-cgi-tracking-proof.yml"
      - "studio_next/**"
      - "pyproject.toml"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-cgi-vfx:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open native runtimes and optional tracking libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg inkscape fonts-dejavu-core libxi6 libxrender1 libxfixes3 libxkbcommon0 libsm6 libgl1
          python -m pip install '.[production,vfx_tracking]'
      - name: Download and verify exact Blender 4.5.15 CPU runtime
        run: |
          curl --fail --location --silent --show-error --retry 2 \
            https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz \
            -o "$RUNNER_TEMP/blender.tar.xz"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'blender.tar.xz'
          with p.open('rb') as stream:actual=hashlib.file_digest(stream,'sha256').hexdigest()
          assert actual=='0d2b8bb2efe97e6c8eb57de6b7322f8800e1984e3125b60decca5f6771e4773e',actual
          PY
          tar --no-same-owner -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/blender-4.5.15-linux-x64" >> "$GITHUB_PATH"
      - name: Verify actual tracking, original sound, local multipart and fail-closed contracts
        run: |
          mkdir -p output/cgi-vfx
          set -o pipefail
          python -m unittest studio_next.test_cgi_tracking studio_next.test_video_reference_inputs \
            studio_next.test_comfy_video_runtime studio_next.test_generative_video_providers -v \
            2>&1 | tee output/cgi-vfx/focused-tests.log
      - name: Build isolated installed wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir output/cgi-vfx/wheels .
          python -m venv --system-site-packages "$RUNNER_TEMP/cgi-installed"
          "$RUNNER_TEMP/cgi-installed/bin/python" -m pip install --force-reinstall --no-deps output/cgi-vfx/wheels/*.whl
      - name: Installed public BODY actually renders CGI and tracked VFX
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/cgi-installed/bin/python" -I - <<'PY'
          import os,studio_next
          from pathlib import Path
          assert Path(studio_next.__file__).resolve().is_relative_to(Path(os.environ['RUNNER_TEMP'])/'cgi-installed')
          PY
          "$RUNNER_TEMP/cgi-installed/bin/python" -u -m studio_next.body_cgi_proof \
            --workspace "$GITHUB_WORKSPACE/output/cgi-vfx/native" --size 384 --frames 24 --samples 16
      - name: Bind physical evidence to exact source
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('output/cgi-vfx/native')
          p=json.loads((root/'native-proof.json').read_text())
          assert p['actual_cgi_frames']==24 and p['actual_tracked_frames']==24
          assert p['original_audio_decoded_pcm_identical']
          assert not p['human_acting_generation_proven']
          p['source_commit']=os.environ['GITHUB_SHA']
          (root/'native-proof.json').write_text(json.dumps(p,indent=2)+'\n')
          print(json.dumps(p,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zx7-installed-cgi-planar-vfx-actual-media
          path: output/cgi-vfx/
          if-no-files-found: warn
          retention-days: 7
