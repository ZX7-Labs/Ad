name: "ZX7 BODY — Real Creative Tools & Recovery Integration Proof"
on:
  workflow_dispatch:
  push:
    branches: [zx7-specialist-free-stack-20261020]
    paths: [".github/workflows/studio-body-real-integration.yml"]
permissions:
  contents: read
  actions: read
jobs:
  verify-media-body-not-artist-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify all technical core contracts before using costly creative tools
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Install genuine rights-cleared free local creative applications
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg inkscape fonts-dejavu-core
          python -m pip install --no-cache-dir "opentimelineio>=0.17,<1"
          ffmpeg -version | head -n 1
          inkscape --version
          python - <<'PY'
          import opentimelineio as otio
          print("ASWF OPENTIMELINEIO REAL INTERCHANGE AVAILABLE",otio.__file__)
          PY
          python -m unittest studio_next.test_editorial_interchange -v
          python -m unittest studio_next.test_composite_mix -v
          python -m unittest studio_next.test_film_finishing -v
          python -m unittest studio_next.test_body_materials studio_next.test_body_integration studio_next.test_body_plugins -v
          python -m unittest studio_next.test_durable_graph -v
          python -m unittest studio_next.test_body_archive studio_next.test_production_qc -v
          python -m studio_next.creative_tool_registry --out output/real-installed-tool-inventory.json
      - name: Restore original actual 2D and Blender 3D footage from separately proven render
        uses: actions/download-artifact@v4
        with:
          name: ZX7-real-multi-engine-2D-3D-film-and-scenes
          run-id: 39513980044
          github-token: ${{ github.token }}
          path: genuine-artifacts
      - name: Execute real non-template creative BODY tool graph with SHA custody and full restart proof
        run: |
          python -u -m studio_next.body_proof \
            --archived genuine-artifacts \
            --out output/verified-body-tools
      - name: Prove complete physical film workspace survives loss and exact-source restart
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,shutil
          from studio_next.body_archive import create_body_archive,restore_body_archive
          from studio_next.body_integration import run_body_project
          root=Path("output/verified-body-tools").resolve()
          snapshot=Path("output/verified-body-tools-loss-recovery.tar.gz").resolve()
          archive=create_body_archive(root,snapshot)
          original=json.loads((root/"film-body-ir.json").read_text())
          count=len(original["tool_graph"])
          shutil.rmtree(root)
          result=restore_body_archive(snapshot,root,expected_sha256=archive["sha256"])
          resumed=run_body_project(original,root)
          assert resumed["status"]=="all_tool_results_verified",resumed
          assert len(resumed["reused"])==count,resumed
          assert len(resumed["completed"])==count
          (Path("output")/"verified-body-restore-proof.json").write_text(json.dumps({
             "physical_archive_sha256":archive["sha256"],
             "archived_real_file_count":archive["files"],
             "all_restored_file_bytes_verified":result["all_physical_bytes_verified"],
             "original_completed_tool_jobs_reused":len(resumed["reused"]),
             "fresh_creative_or_render_inference_calls":0,
             "archive_is_operator_hash_anchored_not_signed":True
          },indent=2)+"\n")
          print("FULL PHYSICAL WORKSPACE LOST AND RESTORED WITH ORIGINAL REAL TOOL OUTPUTS",flush=True)
          PY
      - name: Accept and finish a real original-media project through standalone authenticated body API
        run: |
          python - <<'PY'
          import json,shutil,secrets,threading,time
          from pathlib import Path
          from http.server import ThreadingHTTPServer
          from urllib.request import urlopen,Request
          from studio_next.body_service import LocalBodyCoordinator,make_body_http_handler
          from studio_next.delivery_audit import _probe_details
          from studio_next.body_integration import _witness,validate_witness
          root=Path("output/body-autonomous-service-proof").resolve()
          project=root/"projects"/"real-art-original"
          project.mkdir(parents=True,exist_ok=True)
          source=project/"real-master.mp4"
          shutil.copyfile("output/verified-body-tools/finished-actual-film.mp4",source)
          measured=_probe_details(source)
          film={
            "project":{"creative_intent":"A real owner film submitted through independent authenticated tool API"},
            "assets":[],
            "shots":[{"id":"approved-real-film",
               "purpose":"Physically inspect film and produce author-selected original frame",
               "duration_seconds":measured["duration_seconds"]}],
            "tool_graph":[
              {"id":"measure","tool_id":"body.inspect",
               "purpose":"Check original source movie",
               "inputs":{"source":"real-master.mp4"},"depends_on":[]},
              {"id":"frame","tool_id":"body.film_thumbnail",
               "purpose":"Independent creative selection of an actual film frame",
               "depends_on":["measure"],
               "inputs":{"source_film":"real-master.mp4",
                         "out":"artist-frame.png",
                         "time_seconds":min(0.5,measured["duration_seconds"]/3)}},
              {"id":"verify","tool_id":"body.full_decode",
               "purpose":"Full real picture and sound physical delivery audit",
               "depends_on":["measure"],
               "inputs":{"source":"real-master.mp4","expected":{
                  "width":measured["width"],"height":measured["height"],
                  "require_audio":True}}}
            ]
          }
          token=secrets.token_hex(32)
          backend=LocalBodyCoordinator(root)
          server=ThreadingHTTPServer(("127.0.0.1",0),
                                    make_body_http_handler(backend,token))
          thread=threading.Thread(target=server.serve_forever,daemon=True)
          thread.start()
          origin=f"http://127.0.0.1:{server.server_port}"
          def get(path):
              with urlopen(Request(origin+path,
                   headers={"Authorization":"Bearer "+token}),timeout=30) as res:
                  return json.loads(res.read())
          try:
              request=Request(origin+"/v1/jobs",
                  data=json.dumps({"workspace_id":"real-art-original","film_ir":film}).encode(),
                  headers={"Authorization":"Bearer "+token,
                           "Content-Type":"application/json"},method="POST")
              with urlopen(request,timeout=30) as response:
                  receipt=json.loads(response.read())
              for i in range(120):
                  state=get("/v1/jobs/"+receipt["job_id"])
                  if state["status"] in ("completed","failed","blocked"):break
                  time.sleep(.5)
              assert state["status"]=="completed",state
              assert len(state["result"]["completed"])==3,state
              assert validate_witness("body.film_thumbnail",_witness(project/"artist-frame.png"))
              assert len(get("/v1/tools")["tools"])>=5
              (root/"auth-body-evidence.json").write_text(json.dumps({
                  "standalone_http_authenticated":True,
                  "real_model_independent_job_completed":True,
                  "actual_ffmpeg_movie_read":True,
                  "actual_decoded_frame_created":True,
                  "all_physical_operations_verified":True,
                  "original_artistic_quality_certified":False,
                  "job_id":receipt["job_id"],
                  "completed_tools":state["result"]["completed"]
                },indent=2)+"\n")
          finally:
              server.shutdown();server.server_close();thread.join(timeout=5)
              backend.close()
          again=LocalBodyCoordinator(root)
          try:
              assert again.pending_restart()==0
              assert again.inspect(receipt["job_id"])["attempts"]==1
          finally:again.close()
          print("STANDALONE LOCAL BODY EXECUTED ORIGINAL MEDIA; CHAT NOT REQUIRED",flush=True)
          PY
      - name: Verify playable media and genuine separate editable and graphic artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,hashlib
          root=Path("output/verified-body-tools")
          ledger=json.loads((root/"verified-body-result.json").read_text())
          assert ledger["body_tools_real_video_verified"]
          assert ledger["body_persistent_all_stage_resume_verified"]
          assert ledger["otio_real_editable_project_created"]
          assert ledger["decoded_original_thumbnail"]
          assert ledger["vector_artist_graphic_rasterized"]
          assert ledger["media_vault_sqlite"]
          assert not ledger["independent_creative_film_produced"]
          movie=root/"finished-actual-film.mp4"
          meta=json.loads(subprocess.check_output([
              "ffprobe","-v","error","-show_streams","-show_format","-of","json",str(movie)]))
          assert any(s.get("codec_type")=="video" for s in meta["streams"])
          assert any(s.get("codec_type")=="audio" for s in meta["streams"])
          assert movie.stat().st_size>10000
          import opentimelineio as otio
          editable=otio.adapters.read_from_file(str(root/"finished-actual-film.otio"))
          assert len(editable.video_tracks())==1
          assert len(editable.audio_tracks())==1
          audio=editable.audio_tracks()[0]
          assert len(audio)==len(editable.video_tracks()[0])
          assert isinstance(audio[0],otio.schema.Clip)
          assert isinstance(audio[1],otio.schema.Gap)
          print("PROFESSIONAL EDITABLE PICTURE+ORIGINAL SOUND+INTENTIONAL SILENCE VERIFIED")
          print("VERIFIED ACTUAL INTEROPERABLE MEDIA BODY:")
          for f in (movie,root/"finished-actual-film.otio",
                    root/"designed-original.png",root/"thumbnail.png"):
              print("ORIGINAL ARTIFACT",f,"bytes",f.stat().st_size,
                    "sha256",hashlib.sha256(f.read_bytes()).hexdigest())
          print("ONE-BRAIN PREMIUM FILM QUALITY NOT CLAIMED")
          PY
      - name: Archive genuine body interoperability and previously retained playable movie
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-real-media-body-interoperability-and-restart-evidence
          path: |
            output/verified-body-tools/finished-actual-film.mp4
            output/verified-body-tools/finished-actual-film.otio
            output/verified-body-tools/designed-original.png
            output/verified-body-tools/thumbnail.png
            output/verified-body-tools/verified-body-result.json
            output/verified-body-tools/film-body-ir.json
            output/verified-body-tools/actual-delivery-audit.json
            output/verified-body-tools/delivery-evidence/
            output/verified-body-tools/production.sqlite3
            output/verified-body-tools-loss-recovery.tar.gz
            output/verified-body-restore-proof.json
            output/body-autonomous-service-proof/auth-body-evidence.json
            output/body-autonomous-service-proof/body-jobs.sqlite3
            output/body-autonomous-service-proof/projects/real-art-original/artist-frame.png
            output/verified-body-tools/vault/
          if-no-files-found: warn
          retention-days: 7
