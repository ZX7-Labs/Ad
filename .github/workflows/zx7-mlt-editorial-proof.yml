name: ZX7 MLT Editorial Native Research and Fidelity Gate
on:
  pull_request:
    branches: [main]
    paths:
      - "studio_next/**"
      - ".github/workflows/zx7-mlt-editorial-proof.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-mlt-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  real-mlt-editorial-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install actual open-source MLT engine and media decoders
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y melt ffmpeg frei0r-plugins
          melt -query version
          ffmpeg -version | head -n 1
      - name: Check source syntax and exact editorial ABI
        run: |
          python -m compileall -q studio_next
          python -m unittest studio_next.test_body_mlt_editor studio_next.test_body_mlt_compare studio_next.test_body_mlt_pan -v
      - name: Regression of existing frame-accurate editing and source custody
        run: |
          python -m unittest studio_next.test_body_sequence_cuts studio_next.test_body_timeline_revision studio_next.test_body_tool_contracts -v
      - name: Restore full independent native production test environment
        run: |
          sudo apt-get install -y blender inkscape xvfb python3-tk fonts-dejavu-core fonts-noto-core
          # This *whole-application* suite exercises native MCP model-schema
          # preflight, so install its declared editor extra. Without this,
          # 40 tests errored on missing jsonschema before testing behavior.
          # Keep the other verified native/production extensions installed.
          python -m pip install --no-cache-dir ".[editor,production]" "OpenEXR>=3.3,<4" "opencolorio>=2.5,<2.6" "opencv-python-headless>=4.10,<5"
          python -c 'import jsonschema, mcp; print("Native schema-preflight and MCP dependencies available")'
      - name: Run every existing and new studio application contract on this exact branch
        run: |
          xvfb-run -a python -m unittest discover -s studio_next -p 'test_*.py' -v
