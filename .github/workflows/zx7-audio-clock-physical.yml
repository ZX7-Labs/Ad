name: "ZX7 Native Video Audio: 108-case Exact Physical Sample Clock"
on:
  pull_request:
    branches: [main]
    paths:
      - "studio_next/composite_mix.py"
      - "studio_next/test_composite_mix.py"
      - "studio_next/test_composite_sample_clock.py"
      - "scripts/research_audio_clock.py"
      - ".github/workflows/zx7-audio-clock-physical.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zx7-audio-physical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  physical-sample-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual FFmpeg decoders and production-contract dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --no-cache-dir '.[production]'
      - name: Verify source syntax and exact boundary unit tests
        run: |
          python -m compileall -q studio_next/composite_mix.py scripts/research_audio_clock.py
          python -m unittest studio_next.test_composite_mix -v
      - name: Compare 108 physically decoded timing cases to independent sample oracle
        run: |
          python scripts/research_audio_clock.py --require-conformance \
            --out output/audio-clock-physical-cases.json \
            --summary-out output/audio-clock-physical-summary.json
      - name: Independently assert actual conformance report is complete
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          record=json.loads(Path('output/audio-clock-physical-summary.json').read_text())
          assert record['cases']==108
          assert record['matching_cases']==108
          assert record['mismatching_cases']==0
          assert record['body_execution_failures']==0
          assert record['body_timing_conformance_passed'] is True
          assert record['reference_shift_oracle_passed'] is True
          assert 'professional audio acceptance' in record['not_established']
          print('REAL SAMPLE CLOCK CONFORMANCE: 108/108 CASES, NOT ARTISTIC AUDIO CERTIFICATION')
          PY
      - name: Retain evidence even when the physical test exposes a failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-audio-sample-clock-physical-evidence
          path: output/audio-clock-physical-*.json
          if-no-files-found: warn
          retention-days: 7
