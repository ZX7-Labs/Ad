name: "Research — Stronger 9B Original Screenplay Reference"
on:
  workflow_dispatch:
  push:
    branches: [studio-vnext-independent-proof]
    paths: [".github/workflows/studio-script-9b-reference.yml"]
permissions:
  contents: read
jobs:
  compare-one-real-brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      MODEL_REPO: unsloth/Qwen3.5-9B-GGUF
      MODEL_REVISION: 3885219b6810b007914f3a7950a8d1b469d598a5
      MODEL_FILE: Qwen3.5-9B-Q4_K_M.gguf
      MODEL_BYTES: 5680522464
      MODEL_SHA256: 03b74727a860a56338e042c4420bb3f04b2fec5734175f4cb9fa853daf52b7e8
      MODEL_DIR: models/qwen35-9b
      MODEL_ALIAS: qwen35-9b-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Validate code and safety (not creative-quality certification)
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p "test_*.py" -v
      - name: Reuse verified 9B checkpoint where possible
        uses: actions/cache/restore@v4
        with:
          path: models/qwen35-9b
          key: grounded-qwen35-9b-3885219b6810b007914f3a7950a8d1b469d598a5
      - name: Download pinned public Qwen3.5-9B reference
        run: |
          mkdir -p "$MODEL_DIR"
          if [ ! -f "$MODEL_DIR/$MODEL_FILE" ]; then
            curl --fail --location --silent --show-error --retry 3 \
              "https://huggingface.co/$MODEL_REPO/resolve/$MODEL_REVISION/$MODEL_FILE" \
              -o "$MODEL_DIR/$MODEL_FILE"
          fi
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          p=Path(os.environ["MODEL_DIR"])/os.environ["MODEL_FILE"]
          assert p.stat().st_size==int(os.environ["MODEL_BYTES"])
          with p.open("rb") as f:h=hashlib.file_digest(f,"sha256").hexdigest()
          assert h==os.environ["MODEL_SHA256"],"Wrong model checksum"
          print("PINNED WEIGHTS VERIFIED",p,flush=True)
          PY
      - name: Prepare CPU engine
        run: |
          mkdir -p /tmp/llama
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11750/llama-b11750-bin-ubuntu-x64.tar.gz \
            -o /tmp/llama/runtime.tar.gz
          tar --no-same-owner -xzf /tmp/llama/runtime.tar.gz -C /tmp/llama
          SERVER="$(find /tmp/llama -type f -name llama-server | head -n1)"
          test -n "$SERVER"
          echo "SERVER_BIN=$SERVER" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$SERVER")" >> "$GITHUB_ENV"
      - name: Compare the same FOLD product facts, with independently chosen film concept
        run: |
          mkdir -p output/9b-original-reference
          "$SERVER_BIN" --model "$MODEL_DIR/$MODEL_FILE" \
             --alias "$MODEL_ALIAS" --host 127.0.0.1 --port 8085 \
             --ctx-size 16384 --threads 4 --parallel 1 \
             --reasoning-budget 0 --no-webui \
             > output/9b-original-reference/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time,urllib.request
          for attempt in range(90):
            try:
              with urllib.request.urlopen("http://127.0.0.1:8085/health",timeout=2) as r:
                if r.status==200:break
            except Exception:time.sleep(2)
          else:raise SystemExit("Reference model was not healthy")
          print("REFERENCE MODEL READY",flush=True)
          PY
          python -u -m studio_next.creative_challenge \
             --brief studio_next/experiments/product.json \
             --out output/9b-original-reference \
             --api http://127.0.0.1:8085 --model "$MODEL_ALIAS"
      - name: Retain independent full script, failures and full technical trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creative-9b-reference-product
          path: output/9b-original-reference/
          if-no-files-found: warn
          retention-days: 7
