name: ZX7 All Tracked Source Inventory
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  native-editor-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install BODY contract dependencies
        run: python -m pip install '.[production,editor]'
      - name: Verify native schema transport and host tool grants
        run: python -m unittest studio_next.test_body_editor_client studio_next.test_body_editor_catalog studio_next.test_body_editor_policy studio_next.test_body_editor_mcp -v
      - name: Verify adapter path policy and interrupted startup cleanup
        run: node --test engines/velorn/*.test.mjs
  full-tree-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only the open YAML parser needed for source audit
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Independently test strict source-audit parser and risky call detection
        run: python -m unittest discover -s scripts -p 'test_repo_audit.py' -v
      - name: Verify source pins, parse tracked sources and record file SHA256 digests
        run: python scripts/repo_audit.py --out output/repo-audit/all-tracked-files.json
      - name: Preserve complete source and format verification inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-complete-git-file-inventory
          path: output/repo-audit/
          retention-days: 14
