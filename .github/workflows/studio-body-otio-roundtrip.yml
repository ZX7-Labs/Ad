name: ZX7 BODY Genuine OTIO Audio-Visual Roundtrip
on:
  workflow_dispatch:
  push:
    branches: [zx7-body/mobile-operator-20261021]
    paths:
      - ".github/workflows/studio-body-otio-roundtrip.yml"
      - "studio_next/body_sequence_otio.py"
      - "studio_next/body_materials.py"
      - "studio_next/body_integration.py"
      - "studio_next/body_sequence_cuts.py"
      - "studio_next/media_vault.py"
      - "studio_next/test_body_sequence_otio.py"
permissions:
  contents: read
jobs:
  real-originals-to-professional-otio:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real ASWF OpenTimelineIO and native original footage decoder
        run: |
          python -m pip install --disable-pip-version-check 'opentimelineio==0.18.1'
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Verify immutable exact frame edits across real professional OTIO serialization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/otio-audit
          python -m unittest studio_next.test_body_sequence_otio -v 2>&1 | tee output/otio-audit/native-editable-roundtrip.log
          grep -E '^Ran 8 tests in ' output/otio-audit/native-editable-roundtrip.log
          grep -E '^[[:space:]]*OK[[:space:]]*' output/otio-audit/native-editable-roundtrip.log
          if grep -E 'skipped|SKIP' output/otio-audit/native-editable-roundtrip.log; then
            echo 'Original video/audio source or professional OTIO dependency was skipped' >&2
            exit 1
          fi
      - name: Retain physical industry interchange truth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx7-exact-native-audiovisual-otio-proof
          path: output/otio-audit/
          if-no-files-found: warn
          retention-days: 14
