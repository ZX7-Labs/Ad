name: "AD Director Lab — Offline Creative Planning"
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/director-lab.yml"
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
concurrency:
  group: director-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false
jobs:
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      ((github.event_name == 'issues' || github.event_name == 'issue_comment') &&
       github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[DIRECTOR]') &&
       (github.event_name != 'issue_comment' || github.event.comment.user.login == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test director QA gates (offline, no model needed)
        run: python -m unittest discover -s creative_director -p 'test_*.py' -v
      - name: Install offline llama.cpp CPU inference
        env:
          CMAKE_ARGS: "-DGGML_BLAS=ON -DGGML_BLAS_VENDOR=OpenBLAS"
          FORCE_CMAKE: "1"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libopenblas-dev cmake ninja-build
          python -m pip install --upgrade pip
          python -m pip install "llama-cpp-python==0.3.16" "huggingface-hub>=0.25,<2"
      - name: Cache permitted local director model
        uses: actions/cache@v4
        with:
          path: models/director
          key: qwen3-director-4b-instruct-q4-bartowski-ae44-v1
      - name: Download Apache-2.0 4B-Instruct local creative brain (no paid API)
        run: |
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          p=hf_hub_download(repo_id="bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF",
              filename="Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf",
              revision="ae44f08e1392f39c0e474af10c3ff8355c8b6688",
              local_dir="models/director")
          import os
          assert os.path.getsize(p)>1_000_000_000,p
          print("Verified local GGUF",p)
          PY
      - name: Prepare conversation or demo
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p output/director
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue view "$ISSUE_NUMBER" --json title,body,comments > output/director/issue_conversation.json
          fi
      - name: Think, design, critique and revise (NO VIDEO YET)
        id: brain
        continue-on-error: true
        env:
          OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            python -u -m creative_director --conversation output/director/issue_conversation.json --owner "$OWNER" --model models/director/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf --out output/director
          else
            python -u -m creative_director --brief examples/sample-brief.json --model models/director/Qwen_Qwen3-4B-Instruct-2507-Q4_K_M.gguf --out output/director
          fi
      - name: Artifact with treatment and independent audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: director-creative-treatment
          path: |
            output/director/director_result.json
            output/director/treatment.md
          if-no-files-found: warn
          retention-days: 7
      - name: Reply naturally in owner issue
        if: always() && (github.event_name == 'issues' || github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          file=Path("output/director/director_result.json")
          if not file.exists():
            message="DIRECTOR STATUS: The creative model failed to complete. See workflow logs, no film was produced."
          else:
            v=json.loads(file.read_text())
            if v.get("state")=="needs_input":
              message="DIRECTOR QUESTION: "+v["question"]
            elif v.get("state")=="review_ready":
              p=v["treatment"]
              message="DIRECTOR PLAN READY: "+str(p.get("concept",""))+"\n\nThe director wrote a reviewed shot-by-shot concept. No video has been rendered yet."
            else:
              qa=v.get("qa",{}).get("hard_checks",{})
              message="DIRECTOR REVIEW REQUIRED: The concept did not pass every quality gate. Problems: "+", ".join(qa.get("errors",[])[:4])
          message+="\n\nOpen the [creative plan and review]("+os.environ["RUN_URL"]+"), then download **director-creative-treatment**."
          Path("director_comment.txt").write_text(message)
          PY
          gh issue comment "$NUMBER" --body-file director_comment.txt
