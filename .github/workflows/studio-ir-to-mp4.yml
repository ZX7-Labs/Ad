name: "ZX7 Film IR to Real MP4 — Compiled Execution Proof"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-motion-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Test strict bridge, resource routing and permissions
        run: |
          python -m compileall -q studio_next
          python -m unittest discover -s studio_next -p 'test_*.py' -v
      - name: Install tested compositor runtime (CPU only)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-urw-base35
          python -m pip install "numpy>=1.26,<3" "Pillow>=10,<13"
      - name: Compile independent shot and asset data into executable project
        run: |
          python -m studio_next.motion_bridge \
            --ir studio_next/fixtures/vector_two_scene_film_ir.json \
            --out output/zx7-compiled/project.json
          python -m studio_next.silent_audio \
            --project output/zx7-compiled/project.json \
            --out output/zx7-compiled
      - name: Actually render and encode original motion with score and sound
        run: |
          python -m motion_studio.render \
            --project output/zx7-compiled/project.json \
            --out output/zx7-compiled --width 320 --fps 12
      - name: Independent MP4 technical evidence, not creative quality score
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          target=Path("output/zx7-compiled/sample.mp4")
          report=json.loads(subprocess.check_output(["ffprobe","-v","error",
              "-show_streams","-show_format","-of","json",str(target)]))
          video=[s for s in report["streams"] if s["codec_type"]=="video"]
          audio=[s for s in report["streams"] if s["codec_type"]=="audio"]
          assert len(video)==1 and len(audio)==1
          assert (video[0]["width"],video[0]["height"])==(320,480)
          assert 2.5<float(report["format"]["duration"])<3.4
          assert target.stat().st_size>5000
          manifest=json.loads(Path("output/zx7-compiled/render-manifest.json").read_text())
          assert [s["id"] for s in manifest["scenes"]]==["open","turn"]
          print("PROVEN real MP4",target,round(float(report["format"]["duration"]),2),"seconds",flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZX7-compiled-film-IR-real-mp4
          path: |
            output/zx7-compiled/project.json
            output/zx7-compiled/sample.mp4
            output/zx7-compiled/render-manifest.json
            output/zx7-compiled/frames/*.jpg
          if-no-files-found: warn
          retention-days: 7
