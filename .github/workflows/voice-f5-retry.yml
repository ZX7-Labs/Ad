name: "Voice Lab — F5 research retry"
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test-f5:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "4"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg libsndfile1
      - name: Get identical CC0-derived reference sample
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p voice_lab/reference
          gh run download 39398231080 --repo "$GITHUB_REPOSITORY" --name voice-deep-three-way-comparison --dir voice_lab/reference
          test -s voice_lab/reference/stuart_bell-raw.wav
      - name: Install F5 inference
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install f5-tts soundfile
      - name: Synthesize one non-commercial F5 demo
        run: python -u voice_lab/compare_f5_xtts.py --model f5
      - name: Include reference to model license
        run: |
          echo "F5 pretrained model under CC BY-NC 4.0. Personal non-commercial evaluation only." > voice_lab/comparison/LICENSE-NOTICE.txt
          echo "https://creativecommons.org/licenses/by-nc/4.0/" >> voice_lab/comparison/LICENSE-NOTICE.txt
      - name: Upload sample
        uses: actions/upload-artifact@v4
        with:
          name: noncommercial-voice-f5-retry
          path: voice_lab/comparison/
          retention-days: 7
