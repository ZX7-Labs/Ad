name: "Voice Lab — Confident Cinematic Original"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install open-source CPU voice engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "qwen-tts==0.1.1" "numpy>=1.26,<3" "soundfile>=0.12,<1" "accelerate==1.12.0" "transformers==4.57.3"
          sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Source validation
        run: python -m py_compile voice_lab/design_confident_cinematic.py
      - name: Cache permitted open-weight VoiceDesign model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: qwen3-tts-voicedesign17b-2026-10
      - name: Synthesize original male voice sample
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          TOKENIZERS_PARALLELISM: "false"
          OMP_NUM_THREADS: "4"
        run: python -u voice_lab/design_confident_cinematic.py
      - name: Verify both audio formats
        run: |
          python - <<'PY'
          from pathlib import Path
          import soundfile as sf
          p=Path("voice_lab/voice_fusion/confident-cinematic-original.wav")
          i=sf.info(str(p))
          assert 6<=i.duration<=40 and i.channels==1,(i.duration,i.channels)
          assert p.with_suffix(".mp3").stat().st_size>15000
          print("PASS voice",round(i.duration,2),"seconds",i.samplerate,"Hz")
          PY
      - name: Downloadable MP3 and voice brief
        uses: actions/upload-artifact@v4
        with:
          name: original-confident-cinematic-voice
          path: |
            voice_lab/voice_fusion/*.mp3
            voice_lab/voice_fusion/*.wav
            voice_lab/voice_fusion/*.json
          retention-days: 7
