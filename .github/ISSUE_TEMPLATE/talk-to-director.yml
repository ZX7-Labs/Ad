name: "🎬 Talk to the Creative Director"
description: "Describe your video in normal language. The director will ask one question at a time and make a reviewed creative plan."
title: "[DIRECTOR] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Talk to your creative director
        No complex prompts or editing terminology. Explain your product or idea like you're talking to a real editor.
        The director will plan a concept, narration, art direction, camera, movement, sound and scene transitions.
        If one crucial fact is missing, it will ask **one follow-up in the comments**. Just reply normally.
        **For now this generates only a preproduction creative plan, not a video.**
        This is a public GitHub repository. Do not include secrets, client private data, or unpublished sensitive campaigns.
  - type: textarea
    id: natural_request
    attributes:
      label: Tell me about the video you want
      description: What should we make, and what is important about it? One or two natural sentences are fine.
      placeholder: |
        I run a small app called NOVA that helps creative teams keep their ideas together. I want a short that feels clever and calm, without looking like a typical tech advert. Let viewers know they can explore NOVA.
    validations:
      required: true
